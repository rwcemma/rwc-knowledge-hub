<!-- bb hero collage v14 - FALLBACK MARKUP + CSS ONLY.
     The site FOOTER custom code replaces the contents of #bbp-strip with live
     product images once Shopify responds. The static images below are what
     shows if the store is unreachable, so they are kept in step with the
     footer's COLLAGE list by hand - change one, change the other.
     This section is deliberately NOT shoppable - add-to-cart lives in #bb-shop
     below, so section 1 and section 2 no longer overlap.

     v14 (2026-10-06):
       - The five fallback tiles were Para 1-4 + BioToxin Binder, i.e. the
         parasite protocol. The store is now the whole CellCore collection and
         all parasite wording has come off the site, so the tiles are one
         product from five different categories, matching COLLAGE in the footer.
       - The two sale elements are BACK IN for the 20% FLASHSALE and are now
         SCRIPT-MANAGED, not hand-toggled. #bb-collage-off (the 20% OFF sticker)
         and #bb-collage-code (the "enter code at checkout" chip) are both shown
         or hidden by fillCallouts() in the footer, which reads SALE_ENABLED.
         That means ending a sale is still a one-flag change in the footer and
         these two lines can stay here year-round. Do not hand-delete them.
         The sticker no longer carries the worm glyph it had in September.
     Do NOT add a script tag or data-bb-* attributes here: Webflow can normalise
     bare data-* attributes on publish. -->
<style>
#bb-collage{position:relative;max-width:720px;margin:26px auto 0;background:rgba(255,255,255,.95);border-radius:20px;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(21,79,97,.22);}
#bbp-strip{display:flex;gap:8px;justify-content:center;align-items:flex-end;flex-wrap:wrap;}
#bbp-strip .ci{width:120px;text-align:center;}
#bbp-strip .ci img{width:100%;height:104px;object-fit:contain;display:block;margin:0 auto 6px;}
#bbp-strip .ci .n{font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:.04em;line-height:1.3;color:#7c2a68;}
/* Sale-only styling. No element uses it while the sale is off - kept so the
   next sale needs only the two elements named in the comment above. */
#bb-collage-code{margin:14px auto 0;display:block;text-align:center;font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;color:#7c2a68;background:#fff4f9;border:1px dashed #E5397F;border-radius:40px;padding:8px 16px;max-width:max-content;}
#bb-collage-code b{color:#a01e60;font-weight:800;letter-spacing:.12em;}
#bb-collage .bb-off{position:absolute;top:-16px;right:-14px;z-index:3;width:80px;height:80px;border-radius:50%;background:#E5397F;border:4px solid #fff;box-shadow:0 8px 22px rgba(160,30,96,.45);transform:rotate(-12deg);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
#bb-collage .bb-off svg{width:34px;height:19px;display:block;margin-bottom:2px;}
#bb-collage .bb-off b{font-family:Montserrat,sans-serif;font-size:21px;font-weight:800;line-height:1;color:#fff;}
#bb-collage .bb-off span{font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;line-height:1.2;color:#fff;}
@media screen and (max-width:767px){
  #bb-collage{margin-top:20px;padding:18px 12px 14px;border-radius:16px;}
  #bbp-strip{gap:6px;}
  #bbp-strip .ci{width:30%;}
  #bbp-strip .ci img{height:82px;}
  #bbp-strip .ci .n{font-size:10px;}
  #bb-collage-code{font-size:11.5px;padding:7px 12px;margin-top:12px;}
  #bb-collage .bb-off{width:62px;height:62px;top:-12px;right:-8px;}
  #bb-collage .bb-off svg{width:27px;height:15px;}
  #bb-collage .bb-off b{font-size:17px;}
  #bb-collage .bb-off span{font-size:8px;}
}
</style>
<div id="bb-collage">
  <div class="bb-off" id="bb-collage-off" aria-hidden="true"><b>20%</b><span>OFF</span></div>
  <div id="bbp-strip">
    <div class="ci"><img src="https://cdn.shopify.com/s/files/1/0278/4326/4609/files/Drainage_Activator_81a2d862-1548-40c7-977d-e28c1958a177.png?v=1771961883" alt="Drainage Activator by CellCore"><div class="n">Drainage Activator</div></div>
    <div class="ci"><img src="https://cdn.shopify.com/s/files/1/0278/4326/4609/files/BioToxin_Binder_-_FRONT.png?v=1771950389" alt="BioToxin Binder by CellCore"><div class="n">BioToxin Binder</div></div>
    <div class="ci"><img src="https://cdn.shopify.com/s/files/1/0278/4326/4609/files/CT-Biotic_790f1292-429e-4d24-9847-a7a07cd97185.png?v=1771957074" alt="CT-Biotic by CellCore"><div class="n">CT-Biotic</div></div>
    <div class="ci"><img src="https://cdn.shopify.com/s/files/1/0278/4326/4609/files/Para_1_f1e834e1-a43f-4364-aa3e-da247b3dabc3.png?v=1771981843" alt="Para 1 by CellCore"><div class="n">Para 1</div></div>
    <div class="ci"><img src="https://cdn.shopify.com/s/files/1/0278/4326/4609/files/BC-ATP_-_FRONT.png?v=1771950199" alt="BC-ATP by CellCore"><div class="n">BC-ATP</div></div>
  </div>
  <div id="bb-collage-code">Enter code <b>FLASHSALE</b> at checkout for 20% off</div>
</div>
