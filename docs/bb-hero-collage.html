<!-- bb hero collage v16 - FALLBACK MARKUP + CSS ONLY.
     !! NO LONGER ON THE HOME PAGE. This embed was deleted from the home page in
     !! the Webflow Designer on 2026-10-06, which took the sale banner and its
     !! styling with it. Emma's call: the banner is now built by the FOOTER
     !! SCRIPT (ensureHero / heroCss in bb-store-footer-code.html), so there is
     !! no element in the Designer tree to delete and it cannot be lost that way
     !! again. The sizing lives there too. This file is kept as the record of
     !! the product-strip hero in case it is ever wanted back.
     The site FOOTER custom code replaces the contents of #bbp-strip with live
     product images once Shopify responds. The static images below are what
     shows if the store is unreachable, so they are kept in step with the
     footer's COLLAGE list by hand - change one, change the other.
     This section is deliberately NOT shoppable - add-to-cart lives in #bb-shop
     below, so section 1 and section 2 no longer overlap.

     v14 (2026-10-06):
       - The five fallback tiles were Para 1-4 + BioToxin Binder, i.e. the
         parasite protocol. The store is now the whole CellCore collection and
         all parasite wording has come off the site, so the tiles are one
         product from five different categories, matching COLLAGE in the footer.
       - The two sale elements are BACK IN for the 20% FLASHSALE and are now
         SCRIPT-MANAGED, not hand-toggled. #bb-collage-off (the 20% OFF sticker)
         and #bb-collage-code (the "enter code at checkout" chip) are both shown
         or hidden by fillCallouts() in the footer, which reads SALE_ENABLED.
         That means ending a sale is still a one-flag change in the footer and
         these two lines can stay here year-round. Do not hand-delete them.
         The sticker no longer carries the worm glyph it had in September.
     v15 (2026-10-06): Emma supplied a designed sale graphic for the hero.
       #bb-hero-sale is that image. swapHero() in the footer script shows it
       INSTEAD of #bb-collage while the sale is running, and swaps the product
       strip back the moment the sale ends - so a dated graphic can never be
       left stranded on the page, and the hero stays a one-flag switch.
       The graphic already reads "20% OFF", "OCTOBER 7 - 14" and
       "USE CODE FLASHSALE", so the #bb-collage-off sticker and the
       #bb-collage-code chip hide along with the strip rather than repeating it.
       To change the artwork, upload a new asset and swap the src here; nothing
       in the footer script needs to know.

     v16 (2026-10-06): fixed the sizing. The graphic is 2000x1125 (16:9), so at
       the v15 max-width of 860px it rendered ~484px tall - taller than the H1,
       subhead and buttons put together, and it pushed the CTAs off the first
       screen on a laptop. Now:
         - the container caps at 720px, matching #bb-collage below it, and
         - the IMG carries max-height:44vh, so on a short viewport the graphic
           scales down instead of eating the fold.
       width:auto + max-width:100% + max-height means it always keeps its aspect
       ratio - it is never cropped and never letterboxed. The radius and shadow
       moved from the wrapper onto the img for the same reason: on the wrapper
       they would frame a box wider than the picture once the height cap bites.

     Do NOT add a script tag or data-bb-* attributes here: Webflow can normalise
     bare data-* attributes on publish. -->

  #bb-collage .bb-off b{font-size:17px;}
  #bb-collage .bb-off span{font-size:8px;}
}
</style>
