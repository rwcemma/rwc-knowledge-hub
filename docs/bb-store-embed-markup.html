<!-- bb-store markup v20 - MARKUP + CSS ONLY.
     The JavaScript lives in SITE FOOTER custom code (Project Settings > Custom Code).
     Do NOT add a script here - embed script serialization proved unreliable.

     v18 (2026-10-06) rebuilt this for the CellCore-only, category-browsing shop.
     REMOVED: #bb-store (featured grid), #bb-all-wrap, the search box #bb-q, the
     brand filter #bb-vendor, the sort control #bb-sort, #bb-count and the
     "Load more" button. The shop is now a fixed curated list, so there is
     nothing to search, filter, sort or page through.
     ADDED: #bb-cats (the category chip row) and #bb-cat-sections (one section
     per category). Both are filled entirely by the footer script from its
     CATEGORIES list - this file only supplies the empty containers and styling,
     so adding or renaming a category never means touching this embed.
     #bb-restock is the year-round "we are still here" line; the footer script
     fills it OUTSIDE any sale conditional so it survives the sale ending.
     v19 (2026-10-06) added the styling for the two new discount-code surfaces
     the footer script builds: #bb-code-banner (the standalone band above the
     category chips) and .bb-checkout-code (the line under the Checkout button).
     Both elements are CREATED BY THE FOOTER SCRIPT, not by this file - they are
     only emitted while a sale is running, so these rules sit idle the rest of
     the year. Leave them in place when a sale ends.

     v20 (2026-10-06) added .bb-cat-code, the per-category code line. Emma asked
     for the code "above each section rather than each product", so the footer
     script stopped emitting the .bb-code pill inside product cards and now puts
     one .bb-cat-code line under each category heading instead. The .bb-code
     rules below STAY - the four hidden landing pages still use that pill.

     Do NOT add a script tag or data-bb-* attributes here: Webflow can normalise
     bare data-* attributes on publish. -->

<div id="bb-cats"></div>
<div id="bb-restock"></div>
<div id="bb-cat-sections"></div>

<div id="bb-cart-toggle" aria-label="Open cart">&#128722; <span id="bb-cart-count">0</span></div>
<div id="bb-cart-backdrop"></div>
<aside id="bb-cart-drawer" aria-hidden="true">
  <div class="bb-cart-head"><span>Your Cart</span><button id="bb-cart-close" aria-label="Close">&times;</button></div>
  <div id="bb-cart-lines"></div>
  <div class="bb-cart-foot">
    <div class="bb-cart-sub"><span>Subtotal</span><span id="bb-cart-subtotal">$0.00</span></div>
    <button id="bb-checkout-btn" disabled>Checkout</button>
    <p class="bb-cart-note">Secure checkout is completed on Shopify. Shipping is calculated at checkout.</p>
  </div>
</aside>
<div id="bb-modal-backdrop"></div>
<div id="bb-modal" role="dialog" aria-modal="true">
  <button id="bb-modal-close" aria-label="Close">&times;</button>
  <div id="bb-modal-body"></div>
</div>

<style>
/* ---- Category navigation ---- */
#bb-cats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:1100px;margin:0 auto 10px;font-family:Montserrat,sans-serif;scroll-margin-top:120px;}
#bb-cats .bb-cats-lab{width:100%;text-align:center;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9bb2b6;margin-bottom:4px;}
.bb-cat-chip{display:inline-block;font-size:13px;font-weight:600;color:#7c2a68;background:#fff;border:1px solid #e2d3dc;border-radius:40px;padding:9px 16px;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
.bb-cat-chip:hover{background:#E5397F;border-color:#E5397F;color:#fff;}

/* ---- The year-round reassurance line ---- */
#bb-restock{max-width:1100px;margin:18px auto 34px;font-family:Montserrat,sans-serif;font-size:13.5px;line-height:1.6;color:#3d4d56;background:#f3f9fa;border:1px solid #d9eaee;border-left:4px solid #154F61;border-radius:12px;padding:14px 18px;text-align:center;}
#bb-restock strong{color:#154F61;font-weight:800;}
#bb-restock:empty{display:none;}

/* ---- Category sections ---- */
.bb-cat{max-width:1100px;margin:0 auto 56px;font-family:Montserrat,sans-serif;scroll-margin-top:120px;}
.bb-cat-head{text-align:center;margin-bottom:22px;}
.bb-cat-head h3{font-size:24px;font-weight:800;color:#7c2a68;margin:0 0 4px;}
.bb-cat-head p{font-size:13.5px;color:#6d7f88;margin:0;}
.bb-cat-code{display:inline-block;margin:12px auto 0;font-size:13px;font-weight:600;line-height:1.4;color:#a01e60;background:#fff4f9;border:1px dashed #E5397F;border-radius:40px;padding:8px 18px;}
.bb-cat-code b{font-weight:800;letter-spacing:.12em;}
.bb-cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;}
.bb-cat-top{display:block;text-align:center;margin-top:20px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9bb2b6;text-decoration:none;}
.bb-cat-top:hover{color:#E5397F;}
.bb-empty{text-align:center;color:#7c2a68;padding:30px;font-family:Montserrat,sans-serif;}

/* ---- Product cards ---- */
.bb-cat-grid .bbp{position:relative;background:#fff;border:1px solid #ecdfe6;border-radius:16px;padding:20px 18px 18px;text-align:center;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(21,79,97,.10);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;}
.bb-cat-grid .bbp:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(160,30,96,.20);}
.bb-cat-grid .bbp img{width:100%;height:170px;object-fit:contain;margin-bottom:12px;}
.bb-cat-grid .bbp .t{font-weight:700;font-size:16px;line-height:1.35;color:#7c2a68;margin-bottom:4px;}
.bb-cat-grid .bbp .pr{font-size:15px;color:#4a5a63;margin-bottom:8px;}
.bb-cat-grid .bbp .lm{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a01e60;margin-bottom:14px;}
.bb-cat-grid .bbp button{margin-top:auto;background:#E5397F;color:#fff;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:12px 14px;border:none;border-radius:40px;cursor:pointer;transition:background .15s;}
.bb-cat-grid .bbp button:hover{background:#B0286F;}

/* ---- Cart drawer ---- */
#bb-cart-toggle{position:fixed;bottom:18px;right:18px;z-index:9998;background:#E5397F;color:#fff;font-family:Montserrat,sans-serif;font-weight:700;padding:10px 16px;border-radius:40px;cursor:pointer;box-shadow:0 6px 18px rgba(160,30,96,.35);}
#bb-cart-backdrop{position:fixed;inset:0;background:rgba(21,25,26,.45);z-index:9998;display:none;}
#bb-cart-drawer{position:fixed;top:0;right:0;height:100%;width:380px;max-width:90vw;background:#fff;z-index:9999;box-shadow:-8px 0 30px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;font-family:Montserrat,sans-serif;}
#bb-cart-drawer.open{transform:translateX(0);}
#bb-cart-backdrop.open{display:block;}
.bb-cart-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid #ecdfe6;font-weight:700;font-size:18px;color:#7c2a68;}
.bb-cart-head button{background:none;border:none;font-size:26px;line-height:1;cursor:pointer;color:#7c2a68;}
#bb-cart-lines{flex:1;overflow-y:auto;padding:12px 22px;}
.bb-line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f3e8ee;}
.bb-line img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#faf4f7;}
.bb-line .ln{flex:1;font-size:14px;color:#20303a;}
.bb-line .lp{font-weight:700;color:#7c2a68;}
.bb-line .rm{background:none;border:none;color:#a01e60;cursor:pointer;font-size:12px;text-decoration:underline;padding:0;}
.bb-cart-foot{border-top:1px solid #ecdfe6;padding:18px 22px;}
.bb-cart-sub{display:flex;justify-content:space-between;font-weight:700;color:#20303a;margin-bottom:14px;}
#bb-checkout-btn{width:100%;background:#E5397F;color:#fff;font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em;padding:15px;border:none;border-radius:40px;cursor:pointer;}
#bb-checkout-btn:disabled{opacity:.5;cursor:not-allowed;}
.bb-cart-note{font-size:11px;color:#9bb2b6;text-align:center;margin:10px 0 0;}

/* ---- Product modal ---- */
#bb-modal-backdrop{position:fixed;inset:0;background:rgba(21,25,26,.6);z-index:10000;display:none;}
#bb-modal-backdrop.open{display:block;}
#bb-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:920px;max-width:92vw;max-height:88vh;background:#fff;border-radius:18px;z-index:10001;display:none;overflow:hidden;font-family:Montserrat,sans-serif;box-shadow:0 30px 80px rgba(0,0,0,.35);}
#bb-modal.open{display:block;}
#bb-modal-body{display:grid;grid-template-columns:1fr 1fr;max-height:88vh;}
#bb-modal-close{position:absolute;top:12px;right:14px;z-index:2;background:#fff;border:1px solid #ecdfe6;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:#7c2a68;}
.bb-m-media{background:#faf4f7;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#bb-m-main{width:100%;max-height:300px;object-fit:contain;}
.bb-m-thumbs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;}
.bb-m-thumbs img{width:52px;height:52px;object-fit:contain;background:#fff;border:1px solid #ecdfe6;border-radius:8px;cursor:pointer;padding:4px;}
.bb-m-thumbs img:hover{border-color:#E5397F;}
.bb-m-info{padding:34px 28px 28px;overflow-y:auto;max-height:88vh;display:flex;flex-direction:column;}
.bb-m-info h3{font-size:24px;font-weight:700;color:#7c2a68;margin:0 0 4px;}
.bb-m-price{font-size:18px;color:#4a5a63;margin-bottom:16px;}
.bb-m-desc{font-size:13.5px;line-height:1.65;color:#3d4d56;}
.bb-m-desc p{margin:0 0 12px;}
.bb-m-desc a{color:#a01e60;}
.bb-m-desc i,.bb-m-desc em{font-style:italic;}
.bb-m-info button{margin-top:22px;flex:none;background:#E5397F;color:#fff;font-family:Montserrat,sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:14px 18px;border:none;border-radius:40px;cursor:pointer;transition:background .15s;}
.bb-m-info button:hover{background:#B0286F;}

/* ---- Sale treatment. The footer script only emits these while a sale is
       running, so the rules sit idle the rest of the year. Never delete them to
       "clean up" after a sale - that is what makes switching one on a one-flag
       change. ---- */
.bb-was{color:#8b9aa3;font-weight:400;text-decoration:line-through;}
.bb-now{display:block;color:#d0021b;font-weight:800;font-size:17px;line-height:1.2;margin-top:2px;}
.bb-m-price .bb-now{font-size:24px;margin-top:4px;}
.bb-code{font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a01e60;background:#fff4f9;border:1px dashed #f0a9c9;border-radius:40px;padding:4px 8px;margin:0 auto 8px;display:inline-block;}
.bb-code b{letter-spacing:.12em;}
.bb-m-info .bb-code{margin:0 0 16px;font-size:12px;padding:6px 12px;}
.bb-cart-code{margin:0 0 12px;font-family:Montserrat,sans-serif;font-size:12px;line-height:1.5;color:#7c2a68;background:#fff4f9;border:1px dashed #f0a9c9;border-radius:10px;padding:9px 12px;text-align:center;}
.bb-cart-code.on{color:#1c6b4a;background:#eefaf3;border-color:#8ed5b0;}
.bb-cart-code b{letter-spacing:.1em;}
#bb-code-banner{max-width:1100px;margin:0 auto 22px;font-family:Montserrat,sans-serif;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;text-align:center;background:#fff4f9;border:2px dashed #E5397F;border-radius:14px;padding:16px 20px;}
#bb-code-banner .bb-cb-pct{font-size:20px;font-weight:800;letter-spacing:.04em;color:#E5397F;text-transform:uppercase;line-height:1;}
#bb-code-banner .bb-cb-txt{font-size:15px;font-weight:600;color:#7c2a68;line-height:1.4;}
#bb-code-banner .bb-cb-txt b{font-weight:800;letter-spacing:.12em;color:#a01e60;background:#fff;border:1px solid #f0a9c9;border-radius:6px;padding:2px 8px;}
#bb-code-banner .bb-cb-sub{width:100%;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9bb2b6;}
.bb-checkout-code{margin:12px 0 0;font-family:Montserrat,sans-serif;font-size:12.5px;line-height:1.5;font-weight:600;color:#a01e60;text-align:center;}
.bb-checkout-code b{font-weight:800;letter-spacing:.1em;}
.bb-cat-grid .bbp .bb-off{position:absolute;top:-12px;right:-12px;z-index:3;width:62px;height:62px;border-radius:50%;background:#E5397F;border:3px solid #fff;box-shadow:0 6px 16px rgba(160,30,96,.45);transform:rotate(-12deg);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.bb-cat-grid .bbp .bb-off svg{width:27px;height:15px;display:block;margin-bottom:1px;}
.bb-cat-grid .bbp .bb-off b{font-family:Montserrat,sans-serif;font-size:16px;font-weight:800;line-height:1;color:#fff;}
.bb-cat-grid .bbp .bb-off span{font-family:Montserrat,sans-serif;font-size:8px;font-weight:700;letter-spacing:.12em;line-height:1.1;color:#fff;}

@media screen and (max-width:900px){#bb-modal-body{grid-template-columns:1fr;}.bb-m-media{padding:18px;}#bb-m-main{max-height:190px;}.bb-m-info{padding:22px 20px;max-height:none;}}
@media screen and (max-width:767px){
  #bb-cats{gap:6px;}
  .bb-cat-chip{font-size:11.5px;padding:7px 12px;}
  .bb-cat{margin-bottom:40px;}
  .bb-cat-head h3{font-size:20px;}
  .bb-cat-grid{grid-template-columns:repeat(2,1fr);gap:14px;}
  .bb-cat-grid .bbp{padding:14px 12px 12px;}
  .bb-cat-grid .bbp img{height:120px;}
  .bb-cat-grid .bbp .bb-off{width:50px;height:50px;top:-9px;right:-9px;}
  .bb-cat-grid .bbp .bb-off svg{width:21px;height:12px;}
  .bb-cat-grid .bbp .bb-off b{font-size:13px;}
  .bb-cat-grid .bbp .bb-off span{font-size:7px;}
  #bb-restock{font-size:12.5px;padding:12px 14px;margin-bottom:26px;}
  #bb-code-banner{gap:8px;padding:13px 14px;margin-bottom:18px;}
  #bb-code-banner .bb-cb-pct{font-size:17px;}
  #bb-code-banner .bb-cb-txt{font-size:13.5px;}
  .bb-cat-code{font-size:11.5px;padding:7px 13px;margin-top:10px;}
}
</style>
