<script>
/* bb-store v21 - lives in SITE FOOTER custom code, not an embed.
   Embeds hold markup + CSS only. Failures are isolated so one missing
   element cannot take down the rest. ?bbdebug=1 paints its own panel. */
(function () {
  var DOMAIN  = 'dr-jaban-moore-store.myshopify.com';
  var TOKEN   = 'TOKENPLACEHOLDER';
  var API     = 'https://' + DOMAIN + '/api/2026-07/graphql.json';
  // Everything on sale. Drives the featured grid in #bb-shop, the 20% sticker
  // and the sale pricing. Order here is the order the featured grid renders in.
  var HANDLES = ['para-1-cellcore', 'para-2-cellcore', 'para-3-cellcore', 'para-4',
                 'biotoxin-binder-cellcore', 'para-kit',
                 'drainage-jumpstart-duo', 'parasite-cleanse-power-duo'];
  // Section 1 is a NON-shoppable collage: images only, one sticker on the panel
  // itself (that sticker is static markup in the hero embed, not drawn here).
  // Add-to-cart lives only in section 2, so the two sections no longer overlap.
  var COLLAGE = ['para-1-cellcore', 'para-2-cellcore', 'para-3-cellcore', 'para-4',
                 'biotoxin-binder-cellcore'];
  // Fallback ids, same order as HANDLES. Verified via Admin API.
  var IDS     = ['gid://shopify/Product/4573257007201',
                 'gid://shopify/Product/4573257039969',
                 'gid://shopify/Product/4573257105505',
                 'gid://shopify/Product/6750255612001',
                 'gid://shopify/Product/4573256581217',
                 'gid://shopify/Product/6782540349537',
                 'gid://shopify/Product/7540961771617',
                 'gid://shopify/Product/7540964556897'];
  // ---- The sale ----
  // SALE_ENABLED = is a discount actually running in Shopify. These five values
  // MUST match the Shopify discount EXACTLY: the page only displays prices,
  // Shopify is what charges the customer, so if they drift the page advertises
  // a discount the checkout will not honour. Set SALE_ENABLED false to switch
  // the whole thing off.
  var SALE_ENABLED = true;
  var DISCOUNT     = 'PARASITE';
  var SALE_PCT     = 0.20;
  var SALE_START   = '2026-08-31T20:45:45Z';
  var SALE_END     = '2026-09-08T03:59:59Z';
  var BADGE        = '20%';

  // SALE_PAGES = which paths ADVERTISE the sale. Everywhere else stays quiet:
  // no promo bar, no stickers, no code chips, full prices shown. The product
  // landing pages the quiz routes to are deliberately not on this list - they
  // sell one product on its own merits.
  var SALE_PAGES = ['/'];

  function onSalePage() {
    var path = (window.location.pathname || '/').toLowerCase().replace(/\/+$/, '');
    return SALE_PAGES.indexOf(path || '/') !== -1;
  }

  // Two separate questions, deliberately:
  //   WINDOW - is the code redeemable right now? Site-wide. Drives the CART.
  //   STATE  - should THIS page talk about it? Drives every pixel.
  // Keeping them apart means a quiet page still carries the discount through to
  // checkout. The Power Duo is one of the discounted products, so a shopper who
  // arrives from the quiz is not silently charged more than one who came via the
  // home page - that page just does not shout about it.
  function windowState() {
    if (!SALE_ENABLED) { return 'off'; }
    var now = new Date().getTime();
    if (SALE_START && now < Date.parse(SALE_START)) { return 'before'; }
    if (SALE_END && now > Date.parse(SALE_END)) { return 'ended'; }
    return 'live';
  }
  var WINDOW  = windowState();
  var SALE_ON = SALE_ENABLED && onSalePage();
  var STATE   = SALE_ON ? WINDOW : 'off';

  function saleDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
    } catch (e) { return ''; }
  }
  var DEBUG   = /[?&]bbdebug=1/.test(window.location.search);
  var VERSION = 'v21';

  var byHandle = {};
  var cartId = null;
  try { cartId = localStorage.getItem('bbCartId') || null; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).split('&').join('&amp;').split('<').join('&lt;'); }
  function money(m) { return '$' + Number(m.amount).toFixed(2); }

  // Self-contained diagnostics: does not depend on any page element existing.
  function dbg(msg) {
    if (!DEBUG) { return; }
    if (window.console) { console.log('[bb-store] ' + msg); }
    try {
      var d = $('bb-debug');
      if (!d) {
        d = document.createElement('div');
        d.id = 'bb-debug';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;max-width:100vw;max-height:42vh;overflow:auto;background:#20303a;color:#8fe9ff;font:11px/1.6 monospace;padding:8px 10px;';
        document.body.appendChild(d);
      }
      d.appendChild(document.createTextNode('[bb-store ' + VERSION + '] ' + msg));
      d.appendChild(document.createElement('br'));
    } catch (e) {}
  }

  function safe(label, fn) {
    try { fn(); } catch (e) { dbg('ERROR in ' + label + ': ' + (e && e.message ? e.message : e)); }
  }

  dbg('script executing');

  function report(headline, detail) {
    var grid = $('bb-store');
    if (grid) {
      grid.innerHTML = '<div class="bb-empty"><strong>' + esc(headline) + '</strong>' +
        '<br><small>Add ?bbdebug=1 to the URL for technical detail.</small></div>';
    }
    dbg(headline + ' :: ' + (detail || ''));
  }

  function gql(query, variables) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': TOKEN },
      body: JSON.stringify({ query: query, variables: variables || {} })
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) {}
        return { ok: r.ok, status: r.status, json: j, raw: t };
      });
    });
  }

  function isSale(p) { return HANDLES.indexOf(p.handle) !== -1; }

  // Original struck through, discounted price bold red underneath. Only the
  // sale products get the treatment; the rest of the catalogue prints as-is.
  function priceHtml(p, v) {
    var full = Number(v.price.amount);
    if (!isSale(p) || !SALE_PCT || STATE !== 'live') { return '$' + full.toFixed(2); }
    return '<span class="bb-was">$' + full.toFixed(2) + '</span>' +
           '<span class="bb-now">$' + (full * (1 - SALE_PCT)).toFixed(2) + '</span>';
  }

  // The code, repeated wherever a shopper is looking at a sale price.
  function codeHtml() {
    if (!SALE_ON || STATE === 'ended') { return ''; }
    var txt = STATE === 'live'
      ? 'Use code <b>' + DISCOUNT + '</b>'
      : '<b>' + DISCOUNT + '</b> &middot; from ' + saleDate(SALE_START);
    return '<div class="bb-code">' + txt + '</div>';
  }

  function badgeHtml() {
    if (!SALE_ON || !BADGE || STATE === 'ended') { return ''; }
    return '<div class="bb-off" aria-hidden="true">' +
      '<svg viewBox="0 0 40 22"><path d="M4 15q5-10 10 0t10 0" fill="none" stroke="#ffd7ec" ' +
      'stroke-width="4.5" stroke-linecap="round"/><circle cx="28" cy="13" r="5.4" fill="#ffd7ec"/>' +
      '<circle cx="30.4" cy="11.2" r="1.3" fill="#a01e60"/></svg>' +
      '<b>' + BADGE + '</b><span>OFF</span></div>';
  }

  function card(p) {
    var v = p.variants.nodes[0];
    var img = p.featuredImage ? p.featuredImage.url : '';
    var label = v.availableForSale === false ? 'Sold out' : 'Add to Cart';
    return '<div class="bbp" data-bb-handle="' + p.handle + '">' +
           (isSale(p) ? badgeHtml() : '') +
           '<img src="' + img + '" alt="' + esc(p.title) + '">' +
           '<div class="t">' + esc(p.title) + '</div>' +
           '<div class="pr">' + priceHtml(p, v) + '</div>' +
           (isSale(p) ? codeHtml() : '') +
           '<div class="lm">Learn more</div>' +
           '<button data-bb-add="1">' + label + '</button></div>';
  }

  function renderGrid(items) {
    var grid = $('bb-store');
    if (!grid) { dbg('no #bb-store container'); return; }
    grid.innerHTML = items.map(function (p) { return card(p); }).join('');
    dbg('grid rendered ' + items.length + ' cards');
  }

  // Section 1: images + names only. No prices, no buttons, no data-bb-handle,
  // so nothing here is clickable and it cannot compete with the shop below.
  function renderCollage() {
    var strip = $('bbp-strip');
    if (!strip) { dbg('no #bbp-strip collage container'); return; }
    var html = '';
    for (var i = 0; i < COLLAGE.length; i++) {
      var p = byHandle[COLLAGE[i]];
      if (!p || !p.featuredImage) { continue; }
      html += '<div class="ci"><img src="' + p.featuredImage.url + '" alt="' + esc(p.title) + '">' +
              '<div class="n">' + esc(p.title) + '</div></div>';
    }
    if (html) { strip.innerHTML = html; dbg('collage rendered'); }
    else { dbg('collage: no matching products, static fallback kept'); }
  }

  var PF = 'id title handle vendor descriptionHtml featuredImage{url altText} images(first:4){nodes{url altText}} variants(first:1){nodes{id price{amount currencyCode} availableForSale}}';

  // PRIMARY: aliased product(handle:) with GraphQL variables, so no quoting is
  // needed in the query string. NOTE: products(query:"handle:...") does NOT work
  // on the Storefront API - handle is not a supported filter field and Shopify
  // silently ignores it, returning the first N products in the store instead.
  function queryByHandle() {
    var decls = HANDLES.map(function (h, i) { return '$h' + i + ':String!'; }).join(',');
    var fields = HANDLES.map(function (h, i) { return 'p' + i + ':product(handle:$h' + i + '){' + PF + '}'; }).join(' ');
    var vars = {};
    HANDLES.forEach(function (h, i) { vars['h' + i] = h; });
    return gql('query(' + decls + '){' + fields + '}', vars).then(function (res) {
      if (res.json && res.json.errors) {
        dbg('handle query errors: ' + JSON.stringify(res.json.errors));
        return [];
      }
      var d = (res.json && res.json.data) || {};
      var out = [];
      HANDLES.forEach(function (h, i) { if (d['p' + i]) { out.push(d['p' + i]); } });
      return out;
    });
  }

  // FALLBACK: fetch by product id. Version-stable and immune to filter syntax.
  function queryById() {
    return gql('query($ids:[ID!]!){nodes(ids:$ids){... on Product{' + PF + '}}}', { ids: IDS })
      .then(function (res) {
        if (res.json && res.json.errors) {
          dbg('id query errors: ' + JSON.stringify(res.json.errors));
          return [];
        }
        var nodes = (res.json && res.json.data && res.json.data.nodes) || [];
        return nodes.filter(function (n) { return n && n.handle; });
      });
  }

  function loadProducts() {
    return queryByHandle().then(function (items) {
      if (items.length) { dbg('loaded via handle query'); return items; }
      dbg('handle query empty, trying product ids');
      return queryById().then(function (byId) {
        if (byId.length) { dbg('loaded via id query'); }
        return byId;
      });
    });
  }

  // ---- Brand separation from Dr. Jaban ----
  // This Shopify store is shared with Dr. Jaban, and Shopify defaults a product's
  // vendor to the old shop name ("Dr Jaban Moore - Store") whenever no brand is
  // set. So: hide Jaban-branded products outright, and relabel that default
  // vendor so it never shows up as a brand option.
  // Matched against title + handle, lowercased. NOTE: handles are hyphenated,
  // so any phrase containing a space only ever matches the TITLE. That is load
  // bearing - 'chasing health' must not match the handle
  // 'chasing-health-monthly-subscription-...', which belongs to the still-for-sale
  // Beginner Gallbladder Flush.
  var HIDE_WORDS = ['jaban', 'resistance band', 'kinesiology', 'welcome gift',
                    'chasing health', 'parasites 101'];
  var VENDOR_ALIAS = { 'dr jaban moore - store': 'Other' };

  function isHidden(p) {
    // $0 products are placeholders, client-only lab kits and welcome-gift line
    // items. None of them should ever appear in a public catalogue, and a $0
    // add-to-cart button is worse than useless. Sale products bypass isHidden
    // entirely, so this cannot swallow one of them.
    var v = p.variants && p.variants.nodes && p.variants.nodes[0];
    if (v && v.price && Number(v.price.amount) === 0) { return true; }
    var hay = ((p.title || '') + ' ' + (p.handle || '')).toLowerCase();
    for (var i = 0; i < HIDE_WORDS.length; i++) {
      if (hay.indexOf(HIDE_WORDS[i]) !== -1) { return true; }
    }
    return false;
  }

  function vendorOf(p) {
    var v = p.vendor || 'Other';
    return VENDOR_ALIAS[v.toLowerCase()] || v;
  }

  // ---- Full catalog: search, brand filter, sort ----
  // The whole catalogue is loaded once with LIGHT fields, then filtered and
  // sorted in memory so typing is instant. Descriptions are still fetched
  // per-product when a modal opens.
  var ALL_PF = 'id title handle vendor featuredImage{url altText} variants(first:1){nodes{id price{amount currencyCode} availableForSale}}';
  var catalog = [], filtered = [], shown = 0, catalogReady = false;
  var CHUNK = 48;

  function priceOf(p) { return Number(p.variants.nodes[0].price.amount); }
  function setCount(t) { var el = $('bb-count'); if (el) { el.textContent = t; } }

  function loadAllCatalog(after) {
    gql('query($after:String){products(first:50,after:$after){pageInfo{hasNextPage endCursor} nodes{' + ALL_PF + '}}}',
        { after: after || null })
      .then(function (res) {
        if (res.json && res.json.errors) {
          dbg('catalog errors: ' + JSON.stringify(res.json.errors));
          catalogReady = true; buildVendorList(); applyFilters(); return;
        }
        var conn = res.json && res.json.data && res.json.data.products;
        if (!conn) {
          dbg('catalog: no products connection');
          catalogReady = true; buildVendorList(); applyFilters(); return;
        }
        (conn.nodes || []).forEach(function (p) {
          if (!p || !p.variants || !p.variants.nodes.length) { return; }
          if (HANDLES.indexOf(p.handle) !== -1) { return; }
          if (isHidden(p)) { return; }
          if (byHandle[p.handle]) { return; }
          byHandle[p.handle] = p;
          catalog.push(p);
        });
        setCount('Loading products... ' + catalog.length + ' so far');
        if (conn.pageInfo.hasNextPage) { loadAllCatalog(conn.pageInfo.endCursor); }
        else {
          catalogReady = true;
          dbg('catalog complete: ' + catalog.length + ' products');
          buildVendorList();
          applyFilters();
        }
      })
      .catch(function (e) {
        dbg('catalog fetch failed: ' + (e && e.message ? e.message : e));
        catalogReady = true; buildVendorList(); applyFilters();
      });
  }

  function buildVendorList() {
    var sel = $('bb-vendor');
    if (!sel) { return; }
    var counts = {};
    catalog.forEach(function (p) {
      var v = vendorOf(p);
      counts[v] = (counts[v] || 0) + 1;
    });
    var names = Object.keys(counts).sort(function (a, b) {
      return a.toLowerCase() < b.toLowerCase() ? -1 : (a.toLowerCase() > b.toLowerCase() ? 1 : 0);
    });
    var html = '<option value="">All brands (' + catalog.length + ')</option>';
    names.forEach(function (n) {
      html += '<option value="' + esc(n) + '">' + esc(n) + ' (' + counts[n] + ')</option>';
    });
    sel.innerHTML = html;
    dbg('vendors: ' + names.length);
  }

  function applyFilters() {
    var qEl = $('bb-q'), vEl = $('bb-vendor'), sEl = $('bb-sort');
    var q = ((qEl && qEl.value) || '').trim().toLowerCase();
    var vendor = (vEl && vEl.value) || '';
    var sort = (sEl && sEl.value) || 'featured';

    filtered = catalog.filter(function (p) {
      if (vendor && vendorOf(p) !== vendor) { return false; }
      if (!q) { return true; }
      return (p.title || '').toLowerCase().indexOf(q) !== -1 ||
             vendorOf(p).toLowerCase().indexOf(q) !== -1;
    });

    if (sort === 'az') { filtered.sort(function (a, b) { return a.title.localeCompare(b.title); }); }
    else if (sort === 'za') { filtered.sort(function (a, b) { return b.title.localeCompare(a.title); }); }
    else if (sort === 'plow') { filtered.sort(function (a, b) { return priceOf(a) - priceOf(b); }); }
    else if (sort === 'phigh') { filtered.sort(function (a, b) { return priceOf(b) - priceOf(a); }); }
    else if (sort === 'vendor') {
      filtered.sort(function (a, b) {
        var c = vendorOf(a).localeCompare(vendorOf(b));
        return c !== 0 ? c : a.title.localeCompare(b.title);
      });
    }

    shown = 0;
    var wrap = $('bb-all');
    if (wrap) { wrap.innerHTML = ''; }
    renderChunk();
  }

  function renderChunk() {
    var wrap = $('bb-all');
    if (!wrap) { return; }
    if (!filtered.length) {
      wrap.innerHTML = catalogReady
        ? '<div class="bb-none">No products match that search.</div>'
        : '<div class="bb-none">Loading products...</div>';
      var b0 = $('bb-all-more');
      if (b0) { b0.style.display = 'none'; }
      setCount(catalogReady ? 'Showing 0 products' : ('Loading products... ' + catalog.length + ' so far'));
      return;
    }
    var slice = filtered.slice(shown, shown + CHUNK);
    wrap.insertAdjacentHTML('beforeend', slice.map(function (p) { return card(p); }).join(''));
    shown += slice.length;
    var btn = $('bb-all-more');
    if (btn) { btn.style.display = shown < filtered.length ? '' : 'none'; }
    setCount(catalogReady
      ? ('Showing ' + shown + ' of ' + filtered.length + ' products')
      : ('Loading products... ' + catalog.length + ' so far'));
  }

  // Catalog cards ship without descriptions; fill one in before opening its modal.
  function openModalByHandle(h) {
    var p = byHandle[h];
    if (!p) { return; }
    if (p.descriptionHtml !== undefined) { openModal(p); return; }
    gql('query($id:ID!){node(id:$id){... on Product{descriptionHtml images(first:4){nodes{url altText}}}}}', { id: p.id })
      .then(function (r) {
        var n = r.json && r.json.data && r.json.data.node;
        p.descriptionHtml = (n && n.descriptionHtml) || '';
        if (n && n.images) { p.images = n.images; }
        openModal(p);
      })
      .catch(function () { p.descriptionHtml = ''; openModal(p); });
  }

  // ---- Featured-product landing pages ----
  // Unlinked pages the quiz routes people to. Slug -> Shopify handle. Adding a
  // page is a one-line change here plus a duplicated Webflow page carrying an
  // empty #bb-feature-buy container; everything else on those pages is static.
  var FEATURE = {
    '/parasite-power-duo': 'parasite-cleanse-power-duo'
  };

  function featuredHandle() {
    var path = (window.location.pathname || '/').toLowerCase().replace(/\/+$/, '');
    return FEATURE[path || '/'] || null;
  }

  function renderFeature(p) {
    var box = $('bb-feature-buy');
    if (!box) { return; }
    var v = p.variants.nodes[0];
    var img = p.featuredImage ? p.featuredImage.url : '';
    // data-bb-handle on the card means the existing delegate already handles
    // both add-to-cart and open-the-modal. No new click wiring needed.
    box.innerHTML = '<div class="bb-f-card" data-bb-handle="' + p.handle + '">' +
      '<div class="bb-f-media">' + (isSale(p) ? badgeHtml() : '') +
        '<img src="' + img + '" alt="' + esc(p.title) + '"></div>' +
      '<div class="bb-f-info">' +
        (p.vendor ? '<div class="bb-f-kicker">' + esc(p.vendor) + '</div>' : '') +
        '<h2 class="bb-f-title">' + esc(p.title) + '</h2>' +
        '<div class="bb-f-price">' + priceHtml(p, v) + '</div>' +
        (isSale(p) ? codeHtml() : '') +
        '<button data-bb-add="1">' +
          (v.availableForSale === false ? 'Sold out' : 'Add to Cart') + '</button>' +
        '<button class="bb-f-more" type="button">See full product details</button>' +
      '</div></div>';
    dbg('feature rendered: ' + p.handle);
  }

  // Featured products are usually in HANDLES and already loaded; fetch on demand
  // when a feature page points at something outside the sale set.
  function ensureFeature() {
    if (!$('bb-feature-buy')) { return; }
    var h = featuredHandle();
    if (!h) { dbg('no FEATURE mapping for ' + window.location.pathname); return; }
    if (byHandle[h]) { renderFeature(byHandle[h]); return; }
    gql('query($h:String!){product(handle:$h){' + PF + '}}', { h: h })
      .then(function (r) {
        var p = r.json && r.json.data && r.json.data.product;
        if (!p || !p.variants.nodes.length) { dbg('feature not found: ' + h); return; }
        byHandle[p.handle] = p;
        renderFeature(p);
      })
      .catch(function (e) { dbg('feature fetch failed: ' + (e && e.message ? e.message : e)); });
  }

  // ---- Site-wide promo bar ----
  // Injected rather than placed in an embed so it appears on every page. The
  // Webflow header is position:sticky;top:0, so the bar is fixed above it and
  // both the body padding and the header's top offset are re-measured on resize
  // (the bar wraps to two lines on narrow phones).
  function mountPromo() {
    if (!SALE_ON || STATE === 'ended' || !document.body) { return; }
    var css = document.createElement('style');
    css.textContent =
      '#bb-promo{position:fixed;top:0;left:0;right:0;z-index:9990;display:block;' +
      'background:#a01e60;color:#fff;text-decoration:none;font-family:Montserrat,sans-serif;' +
      'font-size:13px;font-weight:600;letter-spacing:.02em;line-height:1.45;text-align:center;' +
      'padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18);}' +
      '#bb-promo b{color:#ffd7ec;font-weight:800;letter-spacing:.08em;}' +
      '#bb-promo .sep{opacity:.55;padding:0 6px;}' +
      '@media screen and (max-width:600px){#bb-promo{font-size:11.5px;padding:8px 10px;}' +
      '#bb-promo .sep{padding:0 4px;}}';
    document.head.appendChild(css);

    var bar = document.createElement('a');
    bar.id = 'bb-promo';
    bar.href = '#bb-shop';
    bar.innerHTML = STATE === 'live'
      ? '20% OFF the Full Moon Parasite Sale<span class="sep">&middot;</span>' +
        'Use code <b>' + DISCOUNT + '</b> at checkout<span class="sep">&middot;</span>' +
        'Ends ' + saleDate(SALE_END)
      : '20% OFF the Full Moon Parasite Sale<span class="sep">&middot;</span>' +
        'Opens ' + saleDate(SALE_START) + '<span class="sep">&middot;</span>' +
        'Code <b>' + DISCOUNT + '</b>';
    document.body.insertBefore(bar, document.body.firstChild);

    var hdr = document.createElement('style');
    document.head.appendChild(hdr);
    function offset() {
      var h = bar.offsetHeight;
      document.body.style.paddingTop = h + 'px';
      hdr.textContent = '.bb-hdr{top:' + h + 'px !important;}';
    }
    offset();
    window.addEventListener('resize', offset);
  }
  safe('promo bar', mountPromo);

  // Cart quantity stepper styling. Injected rather than added to the store
  // embeds so the home page and every product landing page stay in sync from
  // one place - there are two copies of that embed and they would drift.
  safe('cart qty css', function () {
    var css = document.createElement('style');
    css.textContent =
      '.bb-qty{display:flex;align-items:center;gap:8px;margin-top:8px;}' +
      '.bb-qty .qb{width:26px;height:26px;flex:none;border:1px solid #ecdfe6;background:#fff;' +
      'border-radius:50%;color:#a01e60;font-family:Montserrat,sans-serif;font-size:15px;' +
      'font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;' +
      'justify-content:center;padding:0;transition:background .15s,border-color .15s;}' +
      '.bb-qty .qb:hover{background:#fff4f9;border-color:#E5397F;}' +
      '.bb-qty .qv{min-width:22px;text-align:center;font-weight:700;font-size:14px;color:#20303a;}' +
      '.bb-qty .rm{margin-left:auto;}' +
      '#bb-cart-drawer.busy{opacity:.55;pointer-events:none;}';
    document.head.appendChild(css);
  });

  // Static sale callouts, filled from the same state so nothing contradicts.
  // On a page outside SALE_PAGES they are hidden outright.
  function fillCallouts() {
    var a0 = $('bb-collage-code'), b0 = $('bb-sale-note');
    if (!SALE_ON) {
      if (a0) { a0.style.display = 'none'; }
      if (b0) { b0.style.display = 'none'; }
      return;
    }
    var live = STATE === 'live';
    var short = live
      ? 'Use code <b>' + DISCOUNT + '</b> for 20% off'
      : 'Code <b>' + DISCOUNT + '</b> &middot; opens ' + saleDate(SALE_START);
    var long = live
      ? 'All ' + HANDLES.length + ' sale items below are 20% off with code <b>' + DISCOUNT +
        '</b> &mdash; it is applied for you at checkout. Sale ends ' + saleDate(SALE_END) + '.'
      : 'The 20% off sale opens ' + saleDate(SALE_START) + '. Use code <b>' + DISCOUNT +
        '</b> at checkout on any of the items below.';
    var a = $('bb-collage-code');
    if (a) { if (STATE === 'ended') { a.style.display = 'none'; } else { a.innerHTML = short; } }
    var b = $('bb-sale-note');
    if (b) { if (STATE === 'ended') { b.style.display = 'none'; } else { b.innerHTML = long; } }
  }
  safe('callouts', fillCallouts);

  safe('boot placeholder', function () {
    var grid = $('bb-store');
    if (grid) { grid.innerHTML = '<div class="bb-empty">Loading products&hellip;</div>'; }
    else { dbg('no #bb-store at boot'); }
  });

  loadProducts().then(function (found) {
    // Keep ONLY the products we asked for, in HANDLES order.
    var items = found.filter(function (p) { return HANDLES.indexOf(p.handle) !== -1; })
      .sort(function (a, b) { return HANDLES.indexOf(a.handle) - HANDLES.indexOf(b.handle); });
    if (!items.length) {
      report('No products found.', 'Neither the handle query nor the id query returned any of: ' + HANDLES.join(', '));
      return;
    }
    items.forEach(function (p) { byHandle[p.handle] = p; });
    dbg('resolved ' + items.length + ' of ' + HANDLES.length + ' wanted: ' + items.map(function (p) { return p.handle; }).join(', '));
    safe('renderGrid', function () { renderGrid(items); });
    safe('renderCollage', function () { renderCollage(); });
    safe('feature', ensureFeature);
    safe('catalog', function () { loadAllCatalog(null); });
  }).catch(function (e) {
    report('Store temporarily unavailable.', 'fetch() threw, never reached Shopify (bad hostname, CORS, CSP, extension, offline). Detail: ' + (e && e.message ? e.message : e));
  });

  var CART_FIELDS = 'id checkoutUrl totalQuantity discountCodes{code applicable} cost{subtotalAmount{amount currencyCode}} lines(first:50){nodes{id quantity merchandise{... on ProductVariant{id price{amount currencyCode} product{title featuredImage{url}}}}}}';

  function cartFail(e) {
    dbg('cart error: ' + (e && e.message ? e.message : e));
    alert('Sorry, the cart could not be updated. Please try again.');
  }

  function addToCart(variantId) {
    dbg('addToCart ' + variantId);
    if (!cartId) {
      gql('mutation($lines:[CartLineInput!]!,$codes:[String!]){cartCreate(input:{lines:$lines,discountCodes:$codes}){cart{' + CART_FIELDS + '}}}',
          { lines: [{ merchandiseId: variantId, quantity: 1 }], codes: SALE_ENABLED ? [DISCOUNT] : [] })
        .then(function (r) {
          var c = r.json && r.json.data && r.json.data.cartCreate && r.json.data.cartCreate.cart;
          if (!c) { return cartFail(r.raw); }
          cartId = c.id;
          try { localStorage.setItem('bbCartId', cartId); } catch (e) {}
          renderCart(c); closeModal(); openCart();
        }).catch(cartFail);
    } else {
      gql('mutation($id:ID!,$lines:[CartLineInput!]!){cartLinesAdd(cartId:$id,lines:$lines){cart{' + CART_FIELDS + '}}}',
          { id: cartId, lines: [{ merchandiseId: variantId, quantity: 1 }] })
        .then(function (r) {
          var c = r.json && r.json.data && r.json.data.cartLinesAdd && r.json.data.cartLinesAdd.cart;
          if (!c) {
            cartId = null;
            try { localStorage.removeItem('bbCartId'); } catch (e) {}
            return addToCart(variantId);
          }
          renderCart(c); closeModal(); openCart();
        }).catch(cartFail);
    }
  }

  // One cart mutation at a time. Without this, tapping + three times fires three
  // concurrent updates that each computed their target from the same starting
  // quantity, and the last one to land wins - so the count ends up wrong.
  var cartBusy = false;
  function cartLock(on) {
    cartBusy = on;
    var d = $('bb-cart-drawer');
    if (d) { d.classList[on ? 'add' : 'remove']('busy'); }
  }

  function removeLine(lineId) {
    if (cartBusy) { return; }
    cartLock(true);
    gql('mutation($id:ID!,$lineIds:[ID!]!){cartLinesRemove(cartId:$id,lineIds:$lineIds){cart{' + CART_FIELDS + '}}}',
        { id: cartId, lineIds: [lineId] })
      .then(function (r) {
        cartLock(false);
        var c = r.json && r.json.data && r.json.data.cartLinesRemove && r.json.data.cartLinesRemove.cart;
        if (c) { renderCart(c); }
      }).catch(function (e) { cartLock(false); cartFail(e); });
  }

  // Shopify caps the quantity at what is actually in stock and returns the
  // corrected cart, so the drawer re-renders to the real number rather than the
  // one that was asked for.
  function setLineQty(lineId, qty) {
    if (cartBusy) { return; }
    if (qty < 1) { return removeLine(lineId); }
    cartLock(true);
    gql('mutation($id:ID!,$lines:[CartLineUpdateInput!]!){cartLinesUpdate(cartId:$id,lines:$lines){cart{' + CART_FIELDS + '}}}',
        { id: cartId, lines: [{ id: lineId, quantity: qty }] })
      .then(function (r) {
        cartLock(false);
        var c = r.json && r.json.data && r.json.data.cartLinesUpdate && r.json.data.cartLinesUpdate.cart;
        if (c) { renderCart(c); }
        else { dbg('qty update returned no cart: ' + r.raw); }
      }).catch(function (e) { cartLock(false); cartFail(e); });
  }

  // The code follows the SITE-WIDE window, not the page. A shopper who buys the
  // Power Duo from its quiet landing page still gets the discount they are
  // entitled to; that page simply does not advertise it.
  function checkoutHref(cart) {
    if (!cart || !cart.checkoutUrl) { return ''; }
    if (!SALE_ENABLED || WINDOW === 'ended') { return cart.checkoutUrl; }
    return cart.checkoutUrl + (cart.checkoutUrl.indexOf('?') === -1 ? '?' : '&') +
           'discount=' + encodeURIComponent(DISCOUNT);
  }

  function renderCodeStatus(cart) {
    var el = $('bb-cart-code');
    if (!el) { return; }
    if (!SALE_ON || STATE === 'ended') { el.style.display = 'none'; return; }
    var codes = (cart && cart.discountCodes) || [];
    var live = false;
    for (var i = 0; i < codes.length; i++) {
      if (codes[i].applicable && String(codes[i].code).toUpperCase() === DISCOUNT) { live = true; }
    }
    el.style.display = '';
    el.className = live ? 'bb-cart-code on' : 'bb-cart-code';
    el.innerHTML = live
      ? '&#10003; Code <b>' + DISCOUNT + '</b> applied &mdash; 20% off the sale items in your cart.'
      : (STATE === 'before'
          ? 'Code <b>' + DISCOUNT + '</b> unlocks 20% off from ' + saleDate(SALE_START) + '.'
          : 'Code <b>' + DISCOUNT + '</b> is applied automatically at checkout.');
  }

  function renderCart(cart) {
    renderCodeStatus(cart);
    var count = cart ? cart.totalQuantity : 0;
    var cnt = $('bb-cart-count'); if (cnt) { cnt.textContent = count; }
    var box = $('bb-cart-lines');
    if (box) {
      var lines = (cart && cart.lines.nodes) || [];
      box.innerHTML = lines.length ? lines.map(function (l) {
        var m = l.merchandise, img = m.product.featuredImage ? m.product.featuredImage.url : '';
        // data-qty carries the TARGET quantity for each button, so the handler
        // never has to read a number back out of the DOM and cannot act on a
        // stale one.
        return '<div class="bb-line"><img src="' + img + '"><div class="ln">' + esc(m.product.title) +
               '<br><span class="lp">' + money(m.price) + '</span>' +
               '<div class="bb-qty">' +
                 '<button class="qb" data-line="' + l.id + '" data-qty="' + (l.quantity - 1) +
                   '" aria-label="Decrease quantity">&minus;</button>' +
                 '<span class="qv">' + l.quantity + '</span>' +
                 '<button class="qb" data-line="' + l.id + '" data-qty="' + (l.quantity + 1) +
                   '" aria-label="Increase quantity">+</button>' +
                 '<button class="rm" data-line="' + l.id + '">Remove</button>' +
               '</div></div></div>';
      }).join('') : '<p style="color:#9bb2b6;text-align:center;padding:20px 0;">Your cart is empty.</p>';
    }
    var sub = $('bb-cart-subtotal');
    if (sub) { sub.textContent = cart ? money(cart.cost.subtotalAmount) : '$0.00'; }
    var btn = $('bb-checkout-btn');
    if (btn) {
      btn.disabled = !cart || count === 0;
      btn.onclick = function () { var u = checkoutHref(cart); if (u) { window.location.href = u; } };
    }
  }

  if (cartId) {
    // Rewrite the cart's discount codes on every load. With a sale running this
    // re-attaches the code to a cart begun before it opened; with the sale off
    // it STRIPS a code left on a returning shopper's cart from a previous sale,
    // so an old cart cannot quietly discount an order we are not discounting.
    gql('mutation($id:ID!,$codes:[String!]){cartDiscountCodesUpdate(cartId:$id,discountCodes:$codes){cart{' + CART_FIELDS + '}}}',
        { id: cartId, codes: SALE_ENABLED ? [DISCOUNT] : [] })
      .then(function (r) {
        var d = r.json && r.json.data && r.json.data.cartDiscountCodesUpdate;
        var c = d && d.cart;
        if (c) { renderCart(c); }
        else { try { localStorage.removeItem('bbCartId'); } catch (e) {} cartId = null; }
      }).catch(function () {});
  } else {
    renderCodeStatus(null);
  }

  function cls(id, name, on) { var el = $(id); if (el) { el.classList[on ? 'add' : 'remove'](name); } }
  function openCart()  { cls('bb-cart-drawer', 'open', true);  cls('bb-cart-backdrop', 'open', true); }
  function closeCart() { cls('bb-cart-drawer', 'open', false); cls('bb-cart-backdrop', 'open', false); }
  function closeModal() {
    var m = $('bb-modal');
    if (m) { m.classList.remove('open'); m.removeAttribute('data-bb-handle'); }
    cls('bb-modal-backdrop', 'open', false);
  }

  function openModal(p) {
    var m = $('bb-modal'), body = $('bb-modal-body');
    if (!m || !body) { dbg('no modal container'); return; }
    var v = p.variants.nodes[0];
    var imgs = (p.images && p.images.nodes) || [];
    var main = imgs.length ? imgs[0].url : (p.featuredImage ? p.featuredImage.url : '');
    m.setAttribute('data-bb-handle', p.handle);
    body.innerHTML =
      '<div class="bb-m-media"><img id="bb-m-main" src="' + main + '" alt="' + esc(p.title) + '">' +
        (imgs.length > 1 ? '<div class="bb-m-thumbs">' + imgs.map(function (im) {
          return '<img src="' + im.url + '" data-bb-thumb="1" alt="">'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="bb-m-info"><h3>' + esc(p.title) + '</h3>' +
        '<div class="bb-m-price">' + priceHtml(p, v) + '</div>' +
        (isSale(p) ? codeHtml() : '') +
        '<div class="bb-m-desc">' + (p.descriptionHtml || '<p>No description available.</p>') + '</div>' +
        '<button data-bb-add="1">' + (v.availableForSale === false ? 'Sold out' : 'Add to Cart') + '</button>' +
      '</div>';
    m.classList.add('open');
    cls('bb-modal-backdrop', 'open', true);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) { return; }

    // Bound by id, not a data-* attribute: the education section is a static
    // Webflow embed, and Webflow can normalise bare data-* attributes on publish.
    var COPY_LINKS = { 'bb-drainage-link': 'drainage-jumpstart-duo',
                       'bb-bowel-link': 'bowel-mover' };
    for (var k in COPY_LINKS) {
      if (!COPY_LINKS.hasOwnProperty(k)) { continue; }
      if (t.closest('#' + k)) {
        if (byHandle[COPY_LINKS[k]]) {
          ev.preventDefault();
          openModalByHandle(COPY_LINKS[k]);
        } // else fall through to the href, which scrolls to the shop
        return;
      }
    }
    if (t.closest('#bb-all-more')) { ev.preventDefault(); renderChunk(); return; }
    if (t.closest('#bb-cart-toggle')) { openCart(); return; }
    if (t.closest('#bb-cart-close') || t.id === 'bb-cart-backdrop') { closeCart(); return; }
    if (t.closest('#bb-modal-close') || t.id === 'bb-modal-backdrop') { closeModal(); return; }

    var thumb = t.closest('[data-bb-thumb]');
    if (thumb) { var mn = $('bb-m-main'); if (mn) { mn.src = thumb.getAttribute('src'); } return; }

    var qb = t.closest('.qb');
    if (qb) {
      ev.preventDefault();
      setLineQty(qb.getAttribute('data-line'), parseInt(qb.getAttribute('data-qty'), 10));
      return;
    }

    var rm = t.closest('.rm');
    if (rm) { ev.preventDefault(); removeLine(rm.getAttribute('data-line')); return; }

    var add = t.closest('[data-bb-add]');
    if (add) {
      ev.preventDefault();
      var ac = add.closest('[data-bb-handle]');
      if (!ac) { dbg('add click: no [data-bb-handle] ancestor'); return; }
      var ap = byHandle[ac.getAttribute('data-bb-handle')];
      if (ap && ap.variants.nodes.length) { addToCart(ap.variants.nodes[0].id); }
      else { dbg('add click: product not loaded for ' + ac.getAttribute('data-bb-handle')); }
      return;
    }

    if (t.closest('#bb-modal')) { return; }

    var c = t.closest('[data-bb-handle]');
    if (!c) { return; }
    var h = c.getAttribute('data-bb-handle');
    if (byHandle[h]) { ev.preventDefault(); openModalByHandle(h); }
  });

  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'bb-q') { applyFilters(); }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target && (ev.target.id === 'bb-vendor' || ev.target.id === 'bb-sort')) { applyFilters(); }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeModal(); closeCart(); }
  });
})();
</script>
