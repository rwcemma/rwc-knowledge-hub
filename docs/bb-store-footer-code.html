<script>
/* bb-store v40 - SITE FOOTER custom code. Embeds hold markup + CSS only.
   Failures are isolated. ?bbdebug=1 paints a debug panel.
   !! Webflow caps this box at 50,000 chars and v39 hit it. Check the length
   !! before adding. Full history/rationale lives in the repo instead:
   !! rwcemma/rwc-knowledge-hub -> docs/bb-webflow-parasite-page-handoff.md */
(function () {
  var DOMAIN  = 'dr-jaban-moore-store.myshopify.com';
  var TOKEN   = 'TOKENPLACEHOLDER';
  var API     = 'https://' + DOMAIN + '/api/2026-07/graphql.json';

  // ---- The shop: CellCore only, grouped ----
  // This list IS the storefront. A product not named here is never fetched,
  // never rendered and cannot be linked to.
  //
  // BEFORE ADDING A HANDLE, check in Shopify that it is ACTIVE, vendor
  // "Cellcore Biosciences", and published to the "Biohacking Bombshell"
  // channel. A bad or unpublished handle fails SILENTLY - the product just
  // never appears. Also check it is in the live discount, or the page will
  // show a struck sale price checkout will not honour.
  //
  // A product may sit in more than one category on purpose (Advanced TUDCA is
  // Drainage and Gut). The fetch de-duplicates, so repeats cost nothing.
  //
  // Still deliberately OFF the site (Emma's call, 2026-10-06): the other live
  // CellCore kits and Phase bundles, Beginner Gallbladder Flush, CT-Minerals,
  // ME Support, Optimize A/B. Also Biocidin (wrong brand), the archived Hormone
  // Support Bundle and Daily Foundational Detox Support, and several sheet rows
  // that do not exist in Shopify at all (Core Nutrients, D3+K2 Pro, TriMag,
  // Methyl-B, HydrOxygen). That is why Foundation Support holds one product.
  var CATEGORIES = [
    { key: 'detox', name: 'Full Spectrum Detox',
      blurb: 'The staged protocol, start to finish.',
      handles: ['phase-1-energy-drainage', 'phase-2-gut-immune-support',
                'phase-3-whole-body-immune-support', 'phase-4-systemic-detox'] },
    { key: 'bundles', name: 'Exclusive Bundles',
      blurb: 'Paired formulas at a bundle price.',
      handles: ['parasite-cleanse-power-duo', 'parasite-cleanse-starter-kit',
                'candida-bundle', 'gut-cleanse-bundle', 'gut-reset-duo',
                'drainage-jumpstart-duo'] },
    { key: 'binders', name: 'Binders',
      blurb: 'Bind what the cleanse stirs up.',
      handles: ['biotoxin-binder-cellcore', 'hm-et-binder-cellcore',
                'virradchem-binder-cellcore', 'carboxy-80-grams-new-size'] },
    { key: 'drainage', name: 'Drainage Support',
      blurb: 'Open the pathways before you detox.',
      handles: ['drainage-activator', 'lymphatic-detox-cellcore',
                'kidney-and-liver-detox-cellcore', 'bowel-mover', 'tudca-cellcore'] },
    { key: 'gut', name: 'Gut Support',
      blurb: 'Digestion, enzymes and the microbiome.',
      handles: ['ct-zyme', 'ct-biotic', 'tudca-cellcore', 'biotoxin-binder-cellcore'] },
    { key: 'anti', name: 'Anti-Microbials',
      blurb: 'Targeted formulas for microbial support.',
      // Emma, 2026-10-08: "add the para kit and full moon kit under
      // antimicrobials". Those are ONE product, not two - Shopify has a single
      // "Cellcore Full Moon Para Kit" (handle para-kit) and no separate Full
      // Moon Kit. Verified 2026-10-08: ACTIVE, CellCore, 118 in stock, on the
      // Biohacking Bombshell channel, and in the FLASHSALE discount.
      handles: ['para-1-cellcore', 'para-2-cellcore', 'para-3-cellcore', 'para-4',
                'para-kit',
                'is-bab', 'is-boost', 'is-bart-cellcore', 'is-borr-cellcore'] },
    { key: 'inflam', name: 'Inflammatory Support',
      blurb: 'Calm the immune and inflammatory load.',
      handles: ['cardioimmune', 'cytoimmune', 'inflamma-control', 'gluco-optimizer',
                'ct-zyme'] },
    { key: 'hormone', name: 'Hormone Support',
      blurb: 'Metabolic and hormonal balance.',
      handles: ['s-tro', 'metabolic-activator'] },
    { key: 'foundation', name: 'Foundation Support',
      blurb: 'Daily cellular groundwork.',
      handles: ['bc-atp'] }
  ];

  // Flat, de-duplicated handle list, in first-appearance order.
  var ALL_HANDLES = (function () {
    var seen = {}, out = [];
    for (var i = 0; i < CATEGORIES.length; i++) {
      var hs = CATEGORIES[i].handles;
      for (var j = 0; j < hs.length; j++) {
        if (!seen[hs[j]]) { seen[hs[j]] = 1; out.push(hs[j]); }
      }
    }
    return out;
  })();

  // ---- The sale ----
  // The page only DISPLAYS prices; Shopify charges the customer. If these drift
  // from the real discount, the page advertises something checkout will refuse.
  // Every value below is copied VERBATIM from codeDiscountNodeByCode("FLASHSALE")
  // - do not round or "correct" them. To change the window, change it in SHOPIFY
  // and re-copy. Re-verify PRODUCT COVERAGE too: a partially-covering discount
  // is what caused the v27 Starter Kit mismatch. Confirmed 2026-10-08 that the
  // discount covers all 58 live CellCore products, so isSale() can return true.
  //
  // !! endsAt is 12:37pm Eastern on Oct 14, NOT end of day - an artifact of when
  // !! the discount was made. Emma knows. If she extends it, re-copy endsAt here
  // !! or the page keeps selling for hours after the code stops working.
  var SALE_ENABLED = true;
  var DISCOUNT     = 'FLASHSALE';
  var SALE_PCT     = 0.20;
  var SALE_START   = '2026-10-07T04:30:00Z';
  var SALE_END     = '2026-10-14T16:37:00Z';
  var BADGE        = '20%';

  var SALE_PAGES = ['/', '/parasite-power-duo', '/full-moon-para-kit',
                    '/drainage-duo', '/parasite-starter-duo'];

  function onSalePage() {
    var path = (window.location.pathname || '/').toLowerCase().replace(/\/+$/, '');
    return SALE_PAGES.indexOf(path || '/') !== -1;
  }

  function windowState() {
    if (!SALE_ENABLED) { return 'off'; }
    var now = new Date().getTime();
    if (SALE_START && now < Date.parse(SALE_START)) { return 'before'; }
    if (SALE_END && now > Date.parse(SALE_END)) { return 'ended'; }
    return 'live';
  }
  var WINDOW  = windowState();
  var SALE_ON = SALE_ENABLED && onSalePage();
  var STATE   = SALE_ON ? WINDOW : 'off';

  // Sale dates render in ONE timezone, never the visitor's. toLocaleDateString
  // without a timeZone formats against the DEVICE clock: SALE_START is 04:30Z,
  // which is Oct 7 in Eastern but Oct 6 in Central/Mountain/Pacific, so most
  // shoppers were told the sale opened a day early. This pins display only -
  // windowState() still compares real instants against Shopify.
  var SALE_TZ = 'America/New_York';

  // One formatter for every sale date, so the timezone pin can never be
  // forgotten on a new call site.
  function salePart(iso, opts) {
    var o = { timeZone: SALE_TZ }, k;
    for (k in opts) { if (opts.hasOwnProperty(k)) { o[k] = opts[k]; } }
    try {
      return new Date(iso).toLocaleDateString('en-US', o);
    } catch (e) {
      // Ancient browser with no timeZone support: fall back to device-local
      // rather than printing nothing.
      try { return new Date(iso).toLocaleDateString('en-US', opts); }
      catch (e2) { return ''; }
    }
  }

  function saleDate(iso) {
    return salePart(iso, { month: 'long', day: 'numeric' });
  }

  function ord(n) {
    var suf = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (suf[(v - 20) % 10] || suf[v] || suf[0]);
  }

  // Emma, 2026-10-06: the top banner should read the RANGE, not just the open
  // date - "Oct 7-14th". Built from SALE_START/SALE_END rather than typed, so it
  // cannot drift from the Shopify window, and it survives a sale that straddles
  // two months ("Oct 28-Nov 3rd").
  function saleRange() {
    var am = salePart(SALE_START, { month: 'short' });
    var bm = salePart(SALE_END,   { month: 'short' });
    var ad = salePart(SALE_START, { day: 'numeric' });
    var bd = salePart(SALE_END,   { day: 'numeric' });
    if (!am || !ad || !bd) { return ''; }
    return am + ' ' + ad + '-' + (am === bm ? '' : bm + ' ') + ord(Number(bd));
  }
  var DEBUG   = /[?&]bbdebug=1/.test(window.location.search);
  var VERSION = 'v40';

  // ?product=<shopify-handle> opens that product's modal on load - the shop is
  // one page, so this is what a shareable product link means here. A Shopify
  // product URL would instead send the shopper to Dr. Jaban's Online Store and
  // lose the BB sales channel and the _bb_* cart attributes. Only curated
  // handles resolve; anything else falls through to the normal shop.
  var wantProduct = (function () {
    var m = /[?&]product=([^&#]+)/.exec(window.location.search);
    if (!m) { return null; }
    try { return decodeURIComponent(m[1]).trim().toLowerCase(); }
    catch (e) { return null; }
  })();

  var byHandle = {};
  var cartId = null;
  try { cartId = localStorage.getItem('bbCartId') || null; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).split('&').join('&amp;').split('<').join('&lt;'); }
  function money(m) { return '$' + Number(m.amount).toFixed(2); }

  function dbg(msg) {
    if (!DEBUG) { return; }
    if (window.console) { console.log('[bb-store] ' + msg); }
    try {
      var d = $('bb-debug');
      if (!d) {
        d = document.createElement('div');
        d.id = 'bb-debug';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;max-width:100vw;max-height:42vh;overflow:auto;background:#20303a;color:#8fe9ff;font:11px/1.6 monospace;padding:8px 10px;';
        document.body.appendChild(d);
      }
      d.appendChild(document.createTextNode('[bb-store ' + VERSION + '] ' + msg));
      d.appendChild(document.createElement('br'));
    } catch (e) {}
  }

  function safe(label, fn) {
    try { fn(); } catch (e) { dbg('ERROR in ' + label + ': ' + (e && e.message ? e.message : e)); }
  }

  dbg('script executing');

  function report(headline, detail) {
    var host = $('bb-cat-sections');
    if (host) {
      host.innerHTML = '<div class="bb-empty"><strong>' + esc(headline) + '</strong>' +
        '<br><small>Add ?bbdebug=1 to the URL for technical detail.</small></div>';
    }
    dbg(headline + ' :: ' + (detail || ''));
  }

  function gql(query, variables) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': TOKEN },
      body: JSON.stringify({ query: query, variables: variables || {} })
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) {}
        return { ok: r.ok, status: r.status, json: j, raw: t };
      });
    });
  }

  // Sitewide: the FLASHSALE discount covers every product this storefront sells
  // (verified 2026-10-06), so nothing needs a per-product sale list.
  function isSale() { return true; }

  function priceHtml(p, v) {
    var full = Number(v.price.amount);
    if (!SALE_PCT || STATE !== 'live') { return '$' + full.toFixed(2); }
    return '<span class="bb-was">$' + full.toFixed(2) + '</span>' +
           '<span class="bb-now">$' + (full * (1 - SALE_PCT)).toFixed(2) + '</span>';
  }

  // ---- The discount code, on six surfaces ----
  //   1. #bb-promo         site-wide bar            (mountPromo)
  //   2. #bb-code-banner   above the category chips (mountCodeBanner)
  //   3. the hero          Emma's graphic, set as the .bb-hero background-image
  //                        in the Designer - NOT by this script
  //   4. .bb-cat-code      under each category heading, and under the search
  //                        results heading (categoriesHtml / resultsHtml)
  //   5. #bb-cart-code     cart drawer              (renderCodeStatus)
  //   6. #bb-checkout-code under the Checkout button (ensureCheckoutNote)
  //
  // codeLine() is the single source of truth for the wording. Emma asked for
  // the code at section level, NOT per product - do not reintroduce codeHtml()
  // into card() or openModal().
  //
  // The cart also attaches the code itself (cartCreate + ?discount= on the
  // checkout URL), so it is usually pre-filled. The copy still says "enter it"
  // because that stays true either way and is what Emma asked for.
  function codeLine() {
    return STATE === 'live'
      ? 'Enter code <b>' + DISCOUNT + '</b> at checkout for 20% off'
      : 'Code <b>' + DISCOUNT + '</b> &middot; opens ' + saleDate(SALE_START);
  }

  // The small pill. Only the four hidden landing pages use it now - those pages
  // have no category sections, so without it their only mention of the code
  // would be the promo bar. The shop grid deliberately does NOT call this.
  function codeHtml() {
    if (!SALE_ON || STATE === 'ended') { return ''; }
    return '<div class="bb-code">' + codeLine() + '</div>';
  }

  // One line per category, sitting under the section heading and blurb, so the
  // code reads once per section instead of once per product.
  function catCodeHtml() {
    if (!SALE_ON || STATE === 'ended') { return ''; }
    return '<div class="bb-cat-code">' + codeLine() + '</div>';
  }

  // The loud one: a full-width band directly above the category chips, so the
  // code is on screen before a shopper has scrolled past a single product.
  function mountCodeBanner() {
    if (!SALE_ON || STATE === 'ended') { return; }
    var host = $('bb-cats');
    if (!host || !host.parentNode) { return; }
    if ($('bb-code-banner')) { return; }
    var b = document.createElement('div');
    b.id = 'bb-code-banner';
    b.innerHTML = '<span class="bb-cb-pct">20% OFF</span>' +
      '<span class="bb-cb-txt">' + codeLine() + '</span>' +
      '<span class="bb-cb-sub">Ends ' + saleDate(SALE_END) + '</span>';
    host.parentNode.insertBefore(b, host);
  }

  function badgeHtml() {
    if (!SALE_ON || !BADGE || STATE !== 'live') { return ''; }
    // The sticker used to carry a little worm glyph for the parasite sale.
    // Emma, 2026-10-06: all parasite imagery and wording comes off the site, so
    // the badge is now plain type. The .bb-off svg rules in the embeds are left
    // in place and simply match nothing.
    return '<div class="bb-off" aria-hidden="true">' +
      '<b>' + BADGE + '</b><span>OFF</span></div>';
  }

  function card(p) {
    var v = p.variants.nodes[0];
    var img = p.featuredImage ? p.featuredImage.url : '';
    var label = v.availableForSale === false ? 'Sold out' : 'Add to Cart';
    return '<div class="bbp" data-bb-handle="' + p.handle + '">' +
           badgeHtml() +
           '<img src="' + img + '" alt="' + esc(p.title) + '">' +
           '<div class="t">' + esc(p.title) + '</div>' +
           '<div class="pr">' + priceHtml(p, v) + '</div>' +
           '<div class="lm">Learn more</div>' +
           '<button data-bb-add="1">' + label + '</button></div>';
  }

  // ---- Search (Emma, 2026-10-08) ----
  // Pure local filtering of the products already in memory after
  // loadProducts() - no network call, no Shopify query. (v33 removed a search
  // box, but that one paged the whole shared catalogue; this one does not.)
  //
  // Matched per product: title, vendor, handle with hyphens as spaces (so
  // "hm et binder" works), the names of every category it sits in (so
  // "drainage" finds products whose titles never say it), plus SYNONYMS.
  // NOT matched: descriptionHtml - it carries Prop 65 and FDA language, so
  // "warning" or "california" would return half the shop.
  // Multi-word queries are AND, not OR.
  //
  // SYNONYMS only covers products whose name says nothing about what they are.
  // DO NOT ADD condition or disease names: making a supplement findable by
  // typing a disease is in effect a claim that it treats that disease, which
  // is CellCore's and Emma's call, not a search index's. Product TITLES keep
  // whatever CellCore named them, which is why "Candida Bundle" still matches
  // - that is its name, not a keyword invented here.
  var SYNONYMS = {
    'ct-biotic': 'probiotic probiotics',
    'ct-zyme':   'enzyme enzymes digestive digestion',
    'inflamma-control': 'inflammation'
  };

  var searchQuery = '';
  var searchIndex = {};
  var LIVE = [];

  function norm(x) { return String(x || '').toLowerCase(); }

  function buildSearchIndex() {
    var catOf = {}, i, j;
    for (i = 0; i < CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      for (j = 0; j < c.handles.length; j++) {
        if (!catOf[c.handles[j]]) { catOf[c.handles[j]] = []; }
        catOf[c.handles[j]].push(c.name);
      }
    }
    for (i = 0; i < ALL_HANDLES.length; i++) {
      var h = ALL_HANDLES[i], p = byHandle[h];
      if (!p) { continue; }
      searchIndex[h] = norm([p.title, p.vendor, h.split('-').join(' '),
                             (catOf[h] || []).join(' '), SYNONYMS[h] || ''].join(' '));
    }
  }

  // Returns null when there is no query at all - the caller uses that to tell
  // "show the normal category view" apart from "searched, found nothing".
  function searchHits() {
    var terms = norm(searchQuery).split(/\s+/), kept = [], i, t;
    for (i = terms.length - 1; i >= 0; i--) { if (!terms[i]) { terms.splice(i, 1); } }
    if (!terms.length) { return null; }
    for (i = 0; i < ALL_HANDLES.length; i++) {
      var h = ALL_HANDLES[i], p = byHandle[h];
      if (!p) { continue; }
      var hay = searchIndex[h] || '', ok = true;
      for (t = 0; t < terms.length; t++) {
        if (hay.indexOf(terms[t]) === -1) { ok = false; break; }
      }
      if (ok) { kept.push(p); }
    }
    return kept;
  }

  // The input lives OUTSIDE #bb-cat-sections on purpose: that container is
  // rewritten on every keystroke and would destroy an input mid-type.
  function mountSearch() {
    if ($('bb-search')) { return; }
    var anchor = $('bb-cats');
    if (!anchor || !anchor.parentNode) { return; }
    var wrap = document.createElement('div');
    wrap.id = 'bb-search';
    wrap.innerHTML =
      '<label class="bb-sr-lab" for="bb-q">Search the shop</label>' +
      '<div class="bb-sr-box">' +
        '<svg class="bb-sr-ico" viewBox="0 0 24 24" aria-hidden="true">' +
          '<circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>' +
          '<path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
        '</svg>' +
        '<input id="bb-q" type="search" autocomplete="off" ' +
          'placeholder="Search by product or category…" ' +
          'aria-label="Search the shop by product or category">' +
        '<button type="button" id="bb-q-clear" aria-label="Clear search">&times;</button>' +
      '</div>';
    anchor.parentNode.insertBefore(wrap, anchor);

    var input = $('bb-q');
    var timer = null;
    input.addEventListener('input', function () {
      if (timer) { clearTimeout(timer); }
      // Short debounce: 36 products filter instantly, but this stops a repaint
      // firing between every pair of keystrokes on a slow phone.
      timer = setTimeout(function () { setQuery(input.value); }, 110);
    });
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.stopPropagation(); clearSearch(); }
    });
    $('bb-q-clear').addEventListener('click', clearSearch);
    syncClearBtn();
  }

  function syncClearBtn() {
    var b = $('bb-q-clear');
    if (b) { b.style.display = searchQuery ? '' : 'none'; }
  }

  function setQuery(v) {
    var next = String(v || '');
    if (next === searchQuery) { return; }
    searchQuery = next;
    syncClearBtn();
    paintShop();
  }

  function clearSearch() {
    var input = $('bb-q');
    if (input) { input.value = ''; }
    setQuery('');
    if (input) { input.focus(); }
  }

  function resultsHtml(hits) {
    var q = esc(searchQuery.trim());
    if (!hits.length) {
      return '<div class="bb-sr-empty">' +
               '<h3>Nothing matches &ldquo;' + q + '&rdquo;</h3>' +
               '<p>Try a product name like <b>Para 1</b>, or a category like ' +
               '<b>Binders</b> or <b>Drainage</b>.</p>' +
               '<button type="button" class="bb-sr-clear">Show everything</button>' +
             '</div>';
    }
    return '<section class="bb-cat" id="bb-cat-results">' +
             '<div class="bb-cat-head">' +
               '<h3>' + hits.length + (hits.length === 1 ? ' match' : ' matches') +
                 ' for &ldquo;' + q + '&rdquo;</h3>' +
               '<p><button type="button" class="bb-sr-clear">Clear search</button></p>' +
               catCodeHtml() +
             '</div>' +
             '<div class="bb-cat-grid">' +
               hits.map(function (p) { return card(p); }).join('') +
             '</div>' +
           '</section>';
  }

  function categoriesHtml() {
    // Emma, 2026-10-06: a divider before the first category, so it is obvious a
    // shopper is about to scroll through all of them rather than one list.
    return '<div class="bb-cats-divider"><span>Categories</span></div>' +
      LIVE.map(function (g) {
      return '<section class="bb-cat" id="bb-cat-' + g.cat.key + '">' +
               '<div class="bb-cat-head">' +
                 '<h3>' + esc(g.cat.name) + '</h3>' +
                 '<p>' + esc(g.cat.blurb) + '</p>' +
                 catCodeHtml() +
               '</div>' +
               '<div class="bb-cat-grid">' +
                 g.items.map(function (p) { return card(p); }).join('') +
               '</div>' +
               '<a class="bb-cat-top" href="#bb-cats">Back to categories</a>' +
             '</section>';
    }).join('');
  }

  // The one place #bb-cat-sections is written - first render and every
  // keystroke. renderEvergreen() must follow it; it appends to this container.
  function paintShop() {
    var host = $('bb-cat-sections');
    if (!host) { return; }
    var hits = searchHits();
    host.innerHTML = hits ? resultsHtml(hits) : categoriesHtml();
    var nav = $('bb-cats');
    if (nav) { nav.classList[hits ? 'add' : 'remove']('bb-searching'); }
    safe('evergreen', renderEvergreen);
  }

  // ---- Category navigation and sections ----
  // The chip row is the whole navigation story: click a chip, the page scrolls
  // to that category. Chips are built from CATEGORIES so they can never list a
  // section that does not exist. A category whose products all failed to load
  // is dropped from BOTH the chips and the sections rather than rendering an
  // empty heading - that is what keeps a missing handle from looking like a
  // broken page.
  function renderShop() {
    var nav = $('bb-cats'), host = $('bb-cat-sections');
    if (!host) { dbg('no #bb-cat-sections container'); return; }

    LIVE = [];
    for (var i = 0; i < CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      var items = [];
      for (var j = 0; j < c.handles.length; j++) {
        var p = byHandle[c.handles[j]];
        if (p) { items.push(p); }
        else { dbg('category ' + c.key + ': handle not loaded - ' + c.handles[j]); }
      }
      if (items.length) { LIVE.push({ cat: c, items: items }); }
    }

    if (!LIVE.length) {
      report('Shop temporarily unavailable.', 'No categories resolved any products.');
      return;
    }

    if (nav) {
      nav.innerHTML = '<span class="bb-cats-lab">Shop by Category</span>' +
        LIVE.map(function (g) {
          return '<a class="bb-cat-chip" href="#bb-cat-' + g.cat.key + '" data-bb-cat="' +
                 g.cat.key + '">' + esc(g.cat.name) + '</a>';
        }).join('');
    }

    buildSearchIndex();
    safe('search box', mountSearch);
    paintShop();

    dbg('rendered ' + LIVE.length + ' categories');
  }

  // The year-round reorder line. Deliberately NOT inside any sale conditional -
  // it is the one piece of copy that must survive the sale ending. Emma moved
  // it from above the first category to the END of the shop, so it builds its
  // own element and must run AFTER paintShop(), which rewrites the innerHTML
  // of #bb-cat-sections.
  function renderEvergreen() {
    var host = $('bb-cat-sections');
    if (!host) { return; }
    var el = $('bb-restock');
    if (!el) {
      el = document.createElement('div');
      el.id = 'bb-restock';
    }
    el.innerHTML = '<strong>This shop stays open.</strong> Come back any time to ' +
      'reorder your formulas &mdash; no sale needed, same practitioner-grade ' +
      'products, same checkout.';
    host.appendChild(el);
  }

  var PF = 'id title handle vendor descriptionHtml featuredImage{url altText} images(first:4){nodes{url altText}} variants(first:1){nodes{id price{amount currencyCode} availableForSale}}';

  // Aliased product(handle:) with GraphQL variables, so nothing is quoted into
  // the query string. NEVER switch to products(query:"handle:...") - handle is
  // not a supported Storefront filter and Shopify silently returns the first N
  // products instead, which would put Dr. Jaban's catalogue on this page.
  // Chunked to stay under the query-cost ceiling; the chunks run in parallel.
  function fetchChunk(handles, offset) {
    var decls = handles.map(function (h, i) { return '$h' + (offset + i) + ':String!'; }).join(',');
    var fields = handles.map(function (h, i) {
      return 'p' + (offset + i) + ':product(handle:$h' + (offset + i) + '){' + PF + '}';
    }).join(' ');
    var vars = {};
    handles.forEach(function (h, i) { vars['h' + (offset + i)] = h; });
    return gql('query(' + decls + '){' + fields + '}', vars).then(function (res) {
      if (res.json && res.json.errors) {
        dbg('handle query errors: ' + JSON.stringify(res.json.errors));
        return [];
      }
      var d = (res.json && res.json.data) || {};
      var out = [];
      handles.forEach(function (h, i) {
        var p = d['p' + (offset + i)];
        if (p && p.variants && p.variants.nodes.length) { out.push(p); }
        else { dbg('handle did not resolve: ' + h); }
      });
      return out;
    });
  }

  function loadProducts() {
    var CHUNK = 12, jobs = [];
    for (var i = 0; i < ALL_HANDLES.length; i += CHUNK) {
      jobs.push(fetchChunk(ALL_HANDLES.slice(i, i + CHUNK), i));
    }
    return Promise.all(jobs).then(function (lists) {
      var all = [];
      lists.forEach(function (l) { all = all.concat(l); });
      return all;
    });
  }

  function openDeepLink() {
    if (!wantProduct) { return; }
    if (!byHandle[wantProduct]) { dbg('deep link not on this site: ' + wantProduct); return; }
    var h = wantProduct;
    wantProduct = null;
    dbg('deep link opening ' + h);
    openModalByHandle(h);
  }

  function openModalByHandle(h) {
    var p = byHandle[h];
    if (!p) { return; }
    if (p.descriptionHtml !== undefined) { openModal(p); return; }
    gql('query($id:ID!){node(id:$id){... on Product{descriptionHtml images(first:4){nodes{url altText}}}}}', { id: p.id })
      .then(function (r) {
        var n = r.json && r.json.data && r.json.data.node;
        p.descriptionHtml = (n && n.descriptionHtml) || '';
        if (n && n.images) { p.images = n.images; }
        openModal(p);
      })
      .catch(function () { p.descriptionHtml = ''; openModal(p); });
  }

  // Section 1 of the home page: images and names only, nothing clickable, so it
  // cannot compete with the shop below. The collage embed was deleted from the
  // home page in the Designer on 2026-10-06; this still runs harmlessly if the
  // strip is absent, and serves any page that still has one.
  var COLLAGE = ['drainage-activator', 'biotoxin-binder-cellcore', 'ct-biotic',
                 'para-1-cellcore', 'bc-atp'];
  function renderCollage() {
    var strip = $('bbp-strip');
    if (!strip) { return; }
    var html = '';
    for (var i = 0; i < COLLAGE.length; i++) {
      var p = byHandle[COLLAGE[i]];
      if (!p || !p.featuredImage) { continue; }
      html += '<div class="ci"><img src="' + p.featuredImage.url + '" alt="' + esc(p.title) + '">' +
              '<div class="n">' + esc(p.title) + '</div></div>';
    }
    if (html) { strip.innerHTML = html; dbg('collage rendered'); }
  }

  // ---- Featured-product landing pages ----
  // The four hidden quiz pages. Each feature embed names its own product with
  // <span id="bb-handle-THE-SHOPIFY-HANDLE" hidden>; an element id survives
  // publish where a bare data-* attribute may not.
  // These pages can feature a product that is NOT in CATEGORIES - the Full Moon
  // Para Kit is one - so the on-demand fetch below is load bearing, not a
  // fallback. Do not "optimise" it away.
  var HANDLE_PREFIX = 'bb-handle-';
  var FEATURE = {
    '/parasite-power-duo': 'parasite-cleanse-power-duo',
    '/full-moon-para-kit': 'para-kit',
    '/drainage-duo': 'drainage-jumpstart-duo',
    '/parasite-starter-duo': 'parasite-cleanse-starter-kit'
  };

  function featuredHandle() {
    var marker = document.querySelector('[id^="' + HANDLE_PREFIX + '"]');
    if (marker && marker.id.length > HANDLE_PREFIX.length) {
      return marker.id.slice(HANDLE_PREFIX.length);
    }
    var path = (window.location.pathname || '/').toLowerCase().replace(/\/+$/, '');
    return FEATURE[path || '/'] || null;
  }

  function renderFeature(p) {
    var box = $('bb-feature-buy');
    if (!box) { return; }
    var v = p.variants.nodes[0];
    var img = p.featuredImage ? p.featuredImage.url : '';
    box.innerHTML = '<div class="bb-f-card" data-bb-handle="' + p.handle + '">' +
      '<div class="bb-f-media">' + badgeHtml() +
        '<img src="' + img + '" alt="' + esc(p.title) + '"></div>' +
      '<div class="bb-f-info">' +
        (p.vendor ? '<div class="bb-f-kicker">' + esc(p.vendor) + '</div>' : '') +
        '<h2 class="bb-f-title">' + esc(p.title) + '</h2>' +
        '<div class="bb-f-price">' + priceHtml(p, v) + '</div>' +
        codeHtml() +
        '<button data-bb-add="1">' +
          (v.availableForSale === false ? 'Sold out' : 'Add to Cart') + '</button>' +
        '<button class="bb-f-more" type="button">See full product details</button>' +
      '</div></div>';
    dbg('feature rendered: ' + p.handle);
  }

  function ensureFeature() {
    if (!$('bb-feature-buy')) { return; }
    var h = featuredHandle();
    if (!h) { dbg('no FEATURE mapping for ' + window.location.pathname); return; }
    if (byHandle[h]) { renderFeature(byHandle[h]); return; }
    gql('query($h:String!){product(handle:$h){' + PF + '}}', { h: h })
      .then(function (r) {
        var p = r.json && r.json.data && r.json.data.product;
        if (!p || !p.variants.nodes.length) { dbg('feature not found: ' + h); return; }
        byHandle[p.handle] = p;
        renderFeature(p);
      })
      .catch(function (e) { dbg('feature fetch failed: ' + (e && e.message ? e.message : e)); });
  }

  // ---- Site-wide promo bar ----
  // Injected rather than placed in an embed so it appears on every page. The
  // Webflow header is position:sticky;top:0, so the bar is fixed above it and
  // both the body padding and the header's top offset are re-measured on resize.
  function mountPromo() {
    if (!SALE_ON || STATE === 'ended' || !document.body) { return; }
    var css = document.createElement('style');
    css.textContent =
      '#bb-promo{position:fixed;top:0;left:0;right:0;z-index:9990;display:block;' +
      'background:#a01e60;color:#fff;text-decoration:none;font-family:Montserrat,sans-serif;' +
      'font-size:13px;font-weight:600;letter-spacing:.02em;line-height:1.45;text-align:center;' +
      'padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18);}' +
      '#bb-promo b{color:#ffd7ec;font-weight:800;letter-spacing:.08em;}' +
      '#bb-promo .sep{opacity:.55;padding:0 6px;}' +
      '@media screen and (max-width:600px){#bb-promo{font-size:11.5px;padding:8px 10px;}' +
      '#bb-promo .sep{padding:0 4px;}}';
    document.head.appendChild(css);

    var bar = document.createElement('a');
    bar.id = 'bb-promo';
    bar.href = '#bb-shop';
    bar.innerHTML = STATE === 'live'
      ? '20% OFF the entire shop<span class="sep">&middot;</span>' +
        'Enter code <b>' + DISCOUNT + '</b> at checkout<span class="sep">&middot;</span>' +
        saleRange()
      : 'Flash sale: 20% OFF the entire shop<span class="sep">&middot;</span>' +
        saleRange() + '<span class="sep">&middot;</span>' +
        'Code <b>' + DISCOUNT + '</b>';
    document.body.insertBefore(bar, document.body.firstChild);

    var hdr = document.createElement('style');
    document.head.appendChild(hdr);
    function offset() {
      var h = bar.offsetHeight;
      document.body.style.paddingTop = h + 'px';
      hdr.textContent = '.bb-hdr{top:' + h + 'px !important;}';
    }
    offset();
    window.addEventListener('resize', offset);
  }
  safe('promo bar', mountPromo);

  // Cart quantity stepper styling, injected so the home page and every landing
  // page stay in sync from one place.
  safe('cart qty css', function () {
    var css = document.createElement('style');
    css.textContent =
      '.bb-qty{display:flex;align-items:center;gap:8px;margin-top:8px;}' +
      '.bb-qty .qb{width:26px;height:26px;flex:none;border:1px solid #ecdfe6;background:#fff;' +
      'border-radius:50%;color:#a01e60;font-family:Montserrat,sans-serif;font-size:15px;' +
      'font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;' +
      'justify-content:center;padding:0;transition:background .15s,border-color .15s;}' +
      '.bb-qty .qb:hover{background:#fff4f9;border-color:#E5397F;}' +
      '.bb-qty .qv{min-width:22px;text-align:center;font-weight:700;font-size:14px;color:#20303a;}' +
      '.bb-qty .rm{margin-left:auto;}' +
      '#bb-cart-drawer.busy{opacity:.55;pointer-events:none;}';
    document.head.appendChild(css);
  });

  // ---- The hero banner is NOT built here ----
  // It is the .bb-hero section's background-image, set in the Designer. v37
  // built one here too and the page showed the graphic TWICE. DO NOT re-add a
  // hero element while that style still carries a background-image.
  // Flagged to Emma: a Designer background-image is not tied to SALE_ENABLED,
  // so unlike everything else here it will NOT clear itself when the sale ends.

  function fillCallouts() {
    var off = $('bb-collage-off');
    if (off) { off.style.display = (SALE_ON && BADGE && STATE === 'live') ? '' : 'none'; }
    var a = $('bb-collage-code');
    if (!a) { return; }
    if (!SALE_ON || STATE === 'ended') { a.style.display = 'none'; return; }
    a.style.display = '';
    a.innerHTML = codeLine();
  }
  safe('callouts', fillCallouts);
  safe('code banner', mountCodeBanner);
  safe('checkout note', ensureCheckoutNote);

  safe('boot placeholder', function () {
    var host = $('bb-cat-sections');
    if (host) { host.innerHTML = '<div class="bb-empty">Loading the shop&hellip;</div>'; }
  });

  loadProducts().then(function (found) {
    if (!found.length) {
      report('Shop temporarily unavailable.',
             'None of the ' + ALL_HANDLES.length + ' handles resolved: ' + ALL_HANDLES.join(', '));
      return;
    }
    found.forEach(function (p) { byHandle[p.handle] = p; });
    dbg('resolved ' + found.length + ' of ' + ALL_HANDLES.length + ' handles');
    safe('renderShop', renderShop);   // paintShop() inside it calls renderEvergreen
    safe('renderCollage', renderCollage);
    safe('feature', ensureFeature);
    safe('deep link', openDeepLink);
  }).catch(function (e) {
    report('Shop temporarily unavailable.',
           'fetch() threw, never reached Shopify (bad hostname, CORS, CSP, extension, offline). Detail: ' + (e && e.message ? e.message : e));
  });

  var CART_FIELDS = 'id checkoutUrl totalQuantity discountCodes{code applicable} cost{subtotalAmount{amount currencyCode}} lines(first:50){nodes{id quantity merchandise{... on ProductVariant{id price{amount currencyCode} product{title featuredImage{url}}}}}}';

  function cartFail(e) {
    dbg('cart error: ' + (e && e.message ? e.message : e));
    alert('Sorry, the cart could not be updated. Please try again.');
  }

  // Stamps every cart with where it came from. These ride through to the
  // Shopify ORDER and the abandoned-checkout record, and are the only DURABLE
  // way to tell this storefront's traffic from Dr. Jaban's Online Store - a
  // discount code cannot, since it dies with the sale. Underscore-prefixed so
  // Shopify keeps them off the customer's confirmation. Set once at cart
  // CREATION: first touch, not last.
  function cartAttrs() {
    var path = (window.location.pathname || '/').toLowerCase().replace(/\/+$/, '') || '/';
    return [{ key: '_bb_source', value: 'biohacking-bombshell-webflow' },
            { key: '_bb_landing_page', value: path }];
  }

  function addToCart(variantId) {
    dbg('addToCart ' + variantId);
    if (!cartId) {
      gql('mutation($lines:[CartLineInput!]!,$codes:[String!],$attrs:[AttributeInput!]){cartCreate(input:{lines:$lines,discountCodes:$codes,attributes:$attrs}){cart{' + CART_FIELDS + '}}}',
          { lines: [{ merchandiseId: variantId, quantity: 1 }], codes: SALE_ENABLED ? [DISCOUNT] : [],
            attrs: cartAttrs() })
        .then(function (r) {
          var c = r.json && r.json.data && r.json.data.cartCreate && r.json.data.cartCreate.cart;
          if (!c) { return cartFail(r.raw); }
          cartId = c.id;
          try { localStorage.setItem('bbCartId', cartId); } catch (e) {}
          renderCart(c); closeModal(); openCart();
        }).catch(cartFail);
    } else {
      gql('mutation($id:ID!,$lines:[CartLineInput!]!){cartLinesAdd(cartId:$id,lines:$lines){cart{' + CART_FIELDS + '}}}',
          { id: cartId, lines: [{ merchandiseId: variantId, quantity: 1 }] })
        .then(function (r) {
          var c = r.json && r.json.data && r.json.data.cartLinesAdd && r.json.data.cartLinesAdd.cart;
          if (!c) {
            cartId = null;
            try { localStorage.removeItem('bbCartId'); } catch (e) {}
            return addToCart(variantId);
          }
          renderCart(c); closeModal(); openCart();
        }).catch(cartFail);
    }
  }

  // One cart mutation at a time. Without this, tapping + three times fires three
  // concurrent updates that each computed their target from the same starting
  // quantity, and the last to land wins - so the count ends up wrong.
  var cartBusy = false;
  function cartLock(on) {
    cartBusy = on;
    var d = $('bb-cart-drawer');
    if (d) { d.classList[on ? 'add' : 'remove']('busy'); }
  }

  function removeLine(lineId) {
    if (cartBusy) { return; }
    cartLock(true);
    gql('mutation($id:ID!,$lineIds:[ID!]!){cartLinesRemove(cartId:$id,lineIds:$lineIds){cart{' + CART_FIELDS + '}}}',
        { id: cartId, lineIds: [lineId] })
      .then(function (r) {
        cartLock(false);
        var c = r.json && r.json.data && r.json.data.cartLinesRemove && r.json.data.cartLinesRemove.cart;
        if (c) { renderCart(c); }
      }).catch(function (e) { cartLock(false); cartFail(e); });
  }

  // Shopify caps quantity at what is actually in stock and returns the corrected
  // cart, so the drawer re-renders to the real number, not the requested one.
  function setLineQty(lineId, qty) {
    if (cartBusy) { return; }
    if (qty < 1) { return removeLine(lineId); }
    cartLock(true);
    gql('mutation($id:ID!,$lines:[CartLineUpdateInput!]!){cartLinesUpdate(cartId:$id,lines:$lines){cart{' + CART_FIELDS + '}}}',
        { id: cartId, lines: [{ id: lineId, quantity: qty }] })
      .then(function (r) {
        cartLock(false);
        var c = r.json && r.json.data && r.json.data.cartLinesUpdate && r.json.data.cartLinesUpdate.cart;
        if (c) { renderCart(c); }
        else { dbg('qty update returned no cart: ' + r.raw); }
      }).catch(function (e) { cartLock(false); cartFail(e); });
  }

  // The code follows the SITE-WIDE window, not the page, so the discount reaches
  // checkout from anywhere - including a page not advertising it.
  function checkoutHref(cart) {
    if (!cart || !cart.checkoutUrl) { return ''; }
    if (!SALE_ENABLED || WINDOW === 'ended') { return cart.checkoutUrl; }
    return cart.checkoutUrl + (cart.checkoutUrl.indexOf('?') === -1 ? '?' : '&') +
           'discount=' + encodeURIComponent(DISCOUNT);
  }

  // No store embed carries .bb-cart-code any more, only its styling, so this
  // creates it on demand. That has survived three sale on/off cycles without an
  // embed re-upload.
  function ensureCartCode() {
    if ($('bb-cart-code')) { return $('bb-cart-code'); }
    var foot = document.querySelector('.bb-cart-foot');
    if (!foot) { return null; }
    var p = document.createElement('p');
    p.id = 'bb-cart-code';
    p.className = 'bb-cart-code';
    foot.insertBefore(p, foot.firstChild);
    return p;
  }

  function renderCodeStatus(cart) {
    var el = ensureCartCode();
    if (!el) { return; }
    if (!SALE_ON || STATE === 'ended') { el.style.display = 'none'; return; }
    var codes = (cart && cart.discountCodes) || [];
    var live = false;
    for (var i = 0; i < codes.length; i++) {
      if (codes[i].applicable && String(codes[i].code).toUpperCase() === DISCOUNT) { live = true; }
    }
    el.style.display = '';
    el.className = live ? 'bb-cart-code on' : 'bb-cart-code';
    el.innerHTML = live
      ? '&#10003; Code <b>' + DISCOUNT + '</b> is on your cart &mdash; check it is still ' +
        'applied on the checkout page.'
      : (STATE === 'before'
          ? 'Code <b>' + DISCOUNT + '</b> unlocks 20% off from ' + saleDate(SALE_START) + '.'
          : 'Enter code <b>' + DISCOUNT + '</b> at checkout for 20% off.');
  }

  // The last thing a shopper reads before leaving for Shopify's checkout.
  function ensureCheckoutNote() {
    var btn = $('bb-checkout-btn');
    if (!btn || !btn.parentNode) { return; }
    var n = $('bb-checkout-code');
    if (!SALE_ON || STATE === 'ended') { if (n) { n.style.display = 'none'; } return; }
    if (!n) {
      n = document.createElement('p');
      n.id = 'bb-checkout-code';
      n.className = 'bb-checkout-code';
      btn.parentNode.insertBefore(n, btn.nextSibling);
    }
    n.style.display = '';
    n.innerHTML = codeLine() + '.';
  }

  function renderCart(cart) {
    renderCodeStatus(cart);
    safe('checkout note', ensureCheckoutNote);
    var count = cart ? cart.totalQuantity : 0;
    var cnt = $('bb-cart-count'); if (cnt) { cnt.textContent = count; }
    var box = $('bb-cart-lines');
    if (box) {
      var lines = (cart && cart.lines.nodes) || [];
      box.innerHTML = lines.length ? lines.map(function (l) {
        var m = l.merchandise, img = m.product.featuredImage ? m.product.featuredImage.url : '';
        // data-qty carries the TARGET quantity for each button, so the handler
        // never reads a number back out of the DOM and cannot act on a stale one.
        return '<div class="bb-line"><img src="' + img + '"><div class="ln">' + esc(m.product.title) +
               '<br><span class="lp">' + money(m.price) + '</span>' +
               '<div class="bb-qty">' +
                 '<button class="qb" data-line="' + l.id + '" data-qty="' + (l.quantity - 1) +
                   '" aria-label="Decrease quantity">&minus;</button>' +
                 '<span class="qv">' + l.quantity + '</span>' +
                 '<button class="qb" data-line="' + l.id + '" data-qty="' + (l.quantity + 1) +
                   '" aria-label="Increase quantity">+</button>' +
                 '<button class="rm" data-line="' + l.id + '">Remove</button>' +
               '</div></div></div>';
      }).join('') : '<p style="color:#9bb2b6;text-align:center;padding:20px 0;">Your cart is empty.</p>';
    }
    var sub = $('bb-cart-subtotal');
    if (sub) { sub.textContent = cart ? money(cart.cost.subtotalAmount) : '$0.00'; }
    var btn = $('bb-checkout-btn');
    if (btn) {
      btn.disabled = !cart || count === 0;
      btn.onclick = function () { var u = checkoutHref(cart); if (u) { window.location.href = u; } };
    }
  }

  if (cartId) {
    // Rewrite the cart's discount codes on every load. With a sale running this
    // attaches the current code to a cart begun before it opened; with the sale
    // off it STRIPS a code left from a previous sale, so an old cart cannot
    // quietly discount an order we are not discounting.
    gql('mutation($id:ID!,$codes:[String!]){cartDiscountCodesUpdate(cartId:$id,discountCodes:$codes){cart{' + CART_FIELDS + '}}}',
        { id: cartId, codes: SALE_ENABLED ? [DISCOUNT] : [] })
      .then(function (r) {
        var d = r.json && r.json.data && r.json.data.cartDiscountCodesUpdate;
        var c = d && d.cart;
        if (c) { renderCart(c); }
        else { try { localStorage.removeItem('bbCartId'); } catch (e) {} cartId = null; }
      }).catch(function () {});
  } else {
    renderCodeStatus(null);
  }

  function cls(id, name, on) { var el = $(id); if (el) { el.classList[on ? 'add' : 'remove'](name); } }
  function openCart()  { cls('bb-cart-drawer', 'open', true);  cls('bb-cart-backdrop', 'open', true); }
  function closeCart() { cls('bb-cart-drawer', 'open', false); cls('bb-cart-backdrop', 'open', false); }
  function closeModal() {
    var m = $('bb-modal');
    if (m) { m.classList.remove('open'); m.removeAttribute('data-bb-handle'); }
    cls('bb-modal-backdrop', 'open', false);
  }

  function openModal(p) {
    var m = $('bb-modal'), body = $('bb-modal-body');
    if (!m || !body) { dbg('no modal container'); return; }
    var v = p.variants.nodes[0];
    var imgs = (p.images && p.images.nodes) || [];
    var main = imgs.length ? imgs[0].url : (p.featuredImage ? p.featuredImage.url : '');
    m.setAttribute('data-bb-handle', p.handle);
    body.innerHTML =
      '<div class="bb-m-media"><img id="bb-m-main" src="' + main + '" alt="' + esc(p.title) + '">' +
        (imgs.length > 1 ? '<div class="bb-m-thumbs">' + imgs.map(function (im) {
          return '<img src="' + im.url + '" data-bb-thumb="1" alt="">'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="bb-m-info"><h3>' + esc(p.title) + '</h3>' +
        '<div class="bb-m-price">' + priceHtml(p, v) + '</div>' +
        '<div class="bb-m-desc">' + (p.descriptionHtml || '<p>No description available.</p>') + '</div>' +
        '<button data-bb-add="1">' + (v.availableForSale === false ? 'Sold out' : 'Add to Cart') + '</button>' +
      '</div>';
    m.classList.add('open');
    cls('bb-modal-backdrop', 'open', true);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) { return; }

    // Bound by id, not a data-* attribute: the education section is a static
    // Webflow embed, and Webflow can normalise bare data-* attributes on publish.
    var COPY_LINKS = { 'bb-drainage-link': 'drainage-jumpstart-duo',
                       'bb-bowel-link': 'bowel-mover' };
    for (var k in COPY_LINKS) {
      if (!COPY_LINKS.hasOwnProperty(k)) { continue; }
      if (t.closest('#' + k)) {
        if (byHandle[COPY_LINKS[k]]) {
          ev.preventDefault();
          openModalByHandle(COPY_LINKS[k]);
        } // else fall through to the href, which scrolls to the shop
        return;
      }
    }

    // Either "clear search" button - the one in the results heading and the one
    // in the empty state.
    if (t.closest('.bb-sr-clear')) { ev.preventDefault(); clearSearch(); return; }

    // Category chips scroll rather than jump, and the fixed promo bar means a
    // raw anchor would park the heading underneath it.
    var chip = t.closest('[data-bb-cat]');
    if (chip) {
      ev.preventDefault();
      // While a search is showing, the category sections are not in the DOM, so
      // the chip has nothing to scroll to. Clear the search first, which repaints
      // the categories, THEN scroll to the one that was clicked.
      if (searchQuery) {
        var input = $('bb-q');
        if (input) { input.value = ''; }
        setQuery('');
      }
      var sec = $('bb-cat-' + chip.getAttribute('data-bb-cat'));
      if (sec) {
        var bar = $('bb-promo');
        var pad = (bar ? bar.offsetHeight : 0) + 70;
        var y = sec.getBoundingClientRect().top + window.pageYOffset - pad;
        try { window.scrollTo({ top: y, behavior: 'smooth' }); }
        catch (e) { window.scrollTo(0, y); }
      }
      return;
    }

    if (t.closest('#bb-cart-toggle')) { openCart(); return; }
    if (t.closest('#bb-cart-close') || t.id === 'bb-cart-backdrop') { closeCart(); return; }
    if (t.closest('#bb-modal-close') || t.id === 'bb-modal-backdrop') { closeModal(); return; }

    var thumb = t.closest('[data-bb-thumb]');
    if (thumb) { var mn = $('bb-m-main'); if (mn) { mn.src = thumb.getAttribute('src'); } return; }

    var qb = t.closest('.qb');
    if (qb) {
      ev.preventDefault();
      setLineQty(qb.getAttribute('data-line'), parseInt(qb.getAttribute('data-qty'), 10));
      return;
    }

    var rm = t.closest('.rm');
    if (rm) { ev.preventDefault(); removeLine(rm.getAttribute('data-line')); return; }

    var add = t.closest('[data-bb-add]');
    if (add) {
      ev.preventDefault();
      var ac = add.closest('[data-bb-handle]');
      if (!ac) { dbg('add click: no [data-bb-handle] ancestor'); return; }
      var ap = byHandle[ac.getAttribute('data-bb-handle')];
      if (ap && ap.variants.nodes.length) { addToCart(ap.variants.nodes[0].id); }
      else { dbg('add click: product not loaded for ' + ac.getAttribute('data-bb-handle')); }
      return;
    }

    if (t.closest('#bb-modal')) { return; }

    var c = t.closest('[data-bb-handle]');
    if (!c) { return; }
    var h = c.getAttribute('data-bb-handle');
    if (byHandle[h]) { ev.preventDefault(); openModalByHandle(h); }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeModal(); closeCart(); }
  });
})();
</script>
