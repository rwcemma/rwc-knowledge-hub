<script>
/* Aegis Black Friday 2026 storefront (af-bf v2: retail copy, Nov 2026).
   Products and prices load live from the Synergized Supplements Shopify store
   (myshopify domain dr-jaban-moore-store) through the Storefront API.
   Checkout happens on the Synergized checkout. Append ?bfdebug=1 to see a log. */
(function () {
  // ---------- SETTINGS ----------
  var DOMAIN = 'dr-jaban-moore-store.myshopify.com';
  var TOKEN  = 'TOKENPLACEHOLDER'; // public Storefront token
  var API    = 'https://' + DOMAIN + '/api/2026-07/graphql.json';

  // Sale window, Central time (CST, UTC-6).
  var SALE_START = '2026-11-27T00:00:00-06:00';
  var SALE_END   = '2026-11-30T23:59:59-06:00';

  // The 20% discount. Sale prices only show once ONE of these is set,
  // so the page never advertises a price checkout won't honor.
  var DISCOUNT = '';            // discount CODE from Shopify, e.g. 'BLACKFRIDAY20'
  var AUTO_DISCOUNT = false;    // true if Shopify applies it automatically (no code)
  var SALE_PCT = 20;

  var UTM = 'utm_source=webflow&utm_medium=landing-page&utm_campaign=black-friday-2026';

  // Copy from "Aegis Black Friday Retail Page" doc.
  var PRODUCTS = [
    { id: 'calmaf', group: 'best', handles: ['calm'], name: 'CalmAF', badge: 'Most Popular',
      eyebrow: 'For relaxed focus',
      desc: 'Calm, relaxed, and sharp at the same time. This strip melts on your tongue to quiet anxious thoughts and pull your focus back where you want it, with no drowsiness. Feel the difference in 15 minutes.',
      pop: { h: 'Relaxed focus in 15 minutes',
        open: 'CalmAF is for the moments you need to be settled and sharp at once. It quiets anxious, racing thoughts and brings your focus back to the task in front of you, without making you drowsy. The strip dissolves in about 30 seconds and absorbs through the lining of your mouth, skipping digestion, so most people feel the difference within 15 minutes.',
        blocks: [
          ["What's inside", 'Zembrin, from the South African plant Sceletium tortuosum, and Zynamite, from mango leaf. Both are patented ingredients with published clinical studies behind them.'],
          ['When people reach for it', 'Before a presentation or a flight. During the slump at 3 in the afternoon. When they wake at night and their mind is already running.'],
          ['How to take it', '1 strip a day, or as needed. Let it dissolve without chewing. 30 strips per tin.'],
          ['Good to know', 'AF stands for Aegis Formulas. If you take an antidepressant, talk to your doctor first, since Zembrin can interact with SSRIs and similar medications.']] } },
    { id: 'edge', group: 'best', handles: ['elemental-edge'], name: 'Elemental Edge',
      eyebrow: 'Our most impactful formula',
      desc: 'Most people are low on minerals, and it shows up as restless sleep, scattered focus, flagging energy and an immune system that catches everything going around. Elemental Edge restores them at clinical doses you can feel. For most people, this one product makes the most difference.',
      pop: { h: 'Our most impactful formula',
        open: "An estimated 85% of people are low on minerals, and stress burns through whatever is left. It shows up everywhere: sleep that doesn't restore you, focus that drifts, energy that crashes by midafternoon, an immune system that catches everything going around. Elemental Edge restores those minerals at doses designed to correct a shortfall. That's why, for most people, it's the formula that changes the most.",
        blocks: [
          ["What's inside", '12 vitamins and minerals, including magnesium glycinate, zinc and selenium, plus boron and shilajit. Shilajit’s fulvic acid helps carry nutrients into your cells.'],
          ["Why it's different", 'The ratios are built for a stressed nervous system. Trace mineral drops contain amounts too small to measure. This is doctor-level dosing in 1 formula.'],
          ['How to take it', 'Always with a full meal. Start with 1 capsule and work up to 4 a day, no more than 2 at once. On an empty stomach the zinc and folate can cause nausea. Keep it 2 hours away from prescription medication.']] } },
    { id: 'rebalance', group: 'best', handles: ['rebalance-previously-called-post-pill-ease'], name: 'ReBalance',
      eyebrow: "For women's hormone balance",
      desc: 'When hormones swing, everything swings with them: your mood, your sleep, your patience with the people you love. ReBalance brings vitex, maca, rhodiola and key minerals into 1 daily drink to help women feel like themselves again. The first thing most women notice is the difference in sleep quality. It can also help men with high estrogen.',
      pop: { h: 'Steadier days and deeper sleep, made for women',
        open: 'Hormones are messengers. When they shift, your mood and your sleep follow. Dr. Jess built ReBalance for the pattern she sees most often in women: too much estrogen relative to progesterone, often with histamine in the mix. It gives women support while the deeper work happens.',
        blocks: [
          ["What's inside", 'B6, B12, pantothenic acid, magnesium malate and zinc glycinate, with beet, turmeric, chasteberry, rhodiola, wild yam, blue vervain and maca.'],
          ['What women notice', 'Sleep that leaves them actually rested, and calmer moods through the month.'],
          ['How to take it', '1 scoop in 6 to 10 oz of water, hot or cold, with food. It tastes like an Arnold Palmer. Plenty of women make it a 10-minute ritual of their own. 30 servings per tub.'],
          ['Good to know', 'Not for use during pregnancy or breastfeeding. If you also take NanoGlut+B or another B complex, ask your practitioner about timing.']] } },
    { id: 'clearaf', group: 'more', handles: ['clearaf'], name: 'ClearAF',
      eyebrow: "For fast relief from what's in the air",
      desc: 'Are you sensitive to pollen, smoke, mold, or chemical smells that hit the moment you walk into a room? ClearAF dissolves on your tongue and helps your body reset and feel clear fast. Feel the difference in 15 minutes.',
      pop: { h: 'Feel the difference in 15 minutes',
        open: 'Pollen season, wildfire smoke, a damp basement, a hotel room that reeks of cleaning chemicals. When your body overreacts to what’s around you, put a ClearAF strip on your tongue. It dissolves in seconds, no water or pills, and most people feel their system reset within 15 minutes.',
        blocks: [
          ["What's inside", 'GMI, an immune-balancing protein from Ganoderma mushrooms in the reishi family, with 8000 IU of vitamin D3 and vitamin K2 (MK-7). The D3 and K2 work alongside the GMI and support healthy calcium use.'],
          ['How to take it', '1 strip daily, or as needed. During rough stretches, Dr. Jess uses 1 in the morning and 1 at night. 30 strips per tin.'],
          ['Good to know', "It's also an easy way to keep vitamin D up, since the strip delivers it through your mouth. Talk to your practitioner if you're pregnant, nursing or managing a medical condition."]] } },
    { id: 'nanoglut', group: 'more', handles: ['nanoglut-b'], name: 'NanoGlut+B',
      eyebrow: 'For the afternoon slump',
      desc: "Glutathione, the body's master antioxidant, in a liposomal liquid your body can absorb, paired with active B vitamins. A few pumps under the tongue keep the 3 p.m. crash from taking over your afternoon.",
      pop: { h: 'Glutathione that actually gets in',
        open: "Glutathione is the body's master antioxidant and a key player in how your liver clears toxins. It's also fragile: stomach acid breaks most of it down. NanoGlut+B wraps the glutathione itself in nano-sized liposomes and delivers it as a liquid you hold under your tongue.",
        blocks: [
          ["Why it's different", 'Some formulas call themselves liposomal when only 1 minor ingredient is. In NanoGlut+B, the glutathione is the liposomal part. It comes with active (methylated) B vitamins plus vitamins C and E, in a glycerin base with no alcohol.'],
          ['What people notice', 'Energy that holds through the afternoon.'],
          ['How to take it', '4 pumps twice a day, or 8 pumps once, held under the tongue for 30 seconds. Take it with food at first. 30 servings per bottle.'],
          ['Good to know', "If you're sensitive to methylated B vitamins, start with 1 or 2 pumps and build slowly."]] } },
    { id: 'tudca', group: 'more', handles: ['tudca-max'], name: 'TUDCA Max',
      eyebrow: 'For digestion and liver support',
      desc: 'TUDCA, milk thistle, NAC and shilajit in 1 capsule, to keep digestion running smooth and your brain strong.',
      pop: { h: 'Keep bile moving',
        open: 'Bile breaks down the fats in your food and carries waste out of your body. Think of it like engine oil: over time it gets thick and dirty, and digestion and detox slow down with it. TUDCA Max supports healthy bile flow and liver function. The benefits reach well past digestion: TUDCA helps protect brain and nerve cells, supports mitochondrial energy and a healthy inflammatory response, and helps the liver clear excess histamine.',
        blocks: [
          ["What's inside", 'TUDCA, a bile acid that keeps bile flowing and protects liver and brain cells. NAC, the building block your body uses to make glutathione. Milk thistle, which supports and protects liver cells. Shilajit, whose fulvic acid helps carry nutrients deeper into your cells.'],
          ["Why it's different", 'Most TUDCA products stop at TUDCA and NAC. Adding milk thistle lets 1 capsule replace 3 separate products, and in clinic people tolerate it more easily.'],
          ['How to take it', '1 capsule twice a day with a meal that includes healthy fats, before 4 p.m.'],
          ['Good to know', 'Especially supportive if you no longer have a gallbladder, since your liver now has to make bile on demand. Avoid during pregnancy or nursing.']] } },
    { id: 'ttb', group: 'more', handles: ['total-tox-binder', 'total-tox-binder-copy'], fmts: ['Powder', 'Capsules'], name: 'Total Tox Binder',
      eyebrow: 'For clearing out',
      desc: 'A binder catches what your body releases so it leaves instead of being reabsorbed. 5 whole-food ingredients, nothing else on the label, in powder or capsule.',
      pop: { h: 'So what leaves stays gone',
        open: 'Your body releases toxins every day. A binder catches them in your gut so they leave with your next bowel movement, instead of being reabsorbed. Total Tox Binder supports that process for environmental pollutants, mold byproducts and heavy metals.',
        blocks: [
          ["What's inside", 'Organic chlorella, psyllium husk, cilantro, shilajit and humic acid. Other ingredients: none.'],
          ["Why it's different", "It's a complete binder. Other protocols rotate through 3 separate binders, each for a different job; Total Tox Binder covers mold toxins, environmental chemicals and metals in 1 formula. The capsule holds exactly the same formula as the powder, with no fillers needed to make it fit. 1 scoop equals 4 capsules. Open a capsule and swish it to reach your mouth and throat."],
          ['How to take it', '1 scoop in 6 to 8 oz of water, 1 to 2 times a day on an empty stomach. Start with half a serving. Drink it right away, because the psyllium thickens. It tastes green and earthy.'],
          ['Good to know', 'Keep it 2 hours away from medications. Talk to your practitioner before using it during pregnancy or breastfeeding.']] } }
  ];
  // ---------- end of settings ----------

  var DEBUG = /[?&]bfdebug=1/.test(location.search);
  var LOG = [];
  var CART_KEY = 'afBfCartId';
  var byHandle = {};
  var cartId = null;
  try { cartId = localStorage.getItem(CART_KEY) || null; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(n) { return '$' + Number(n).toFixed(2); }
  function dbg(msg) {
    LOG.push(msg);
    if (window.console) { console.log('[af-bf] ' + msg); }
    if (!DEBUG) { return; }
    var p = $('bf-debug');
    if (!p) { p = document.createElement('div'); p.id = 'bf-debug'; document.body.appendChild(p); }
    p.textContent = LOG.join('\n');
  }
  function safe(label, fn) { try { fn(); } catch (e) { dbg(label + ' failed: ' + (e && e.message ? e.message : e)); } }

  function windowState() {
    var now = Date.now();
    if (now < Date.parse(SALE_START)) { return 'before'; }
    if (now > Date.parse(SALE_END)) { return 'ended'; }
    return 'live';
  }
  var STATE = windowState();
  function codeOn() { return !!DISCOUNT && STATE !== 'ended'; }
  function pctOn() { return SALE_PCT > 0 && (!!DISCOUNT || AUTO_DISCOUNT) && STATE !== 'ended'; }

  function gql(query, variables) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': TOKEN },
      body: JSON.stringify({ query: query, variables: variables || {} })
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = JSON.parse(t); } catch (e) {}
        if (!r.ok) { dbg('HTTP ' + r.status + ': ' + t.slice(0, 300)); }
        if (j && j.errors) { dbg('GraphQL errors: ' + JSON.stringify(j.errors).slice(0, 300)); }
        return { status: r.status, json: j, raw: t };
      });
    });
  }

  // ---------- countdown ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function paintCountdowns() {
    STATE = windowState();
    var els = document.querySelectorAll('.bf-countdown');
    var target = STATE === 'before' ? Date.parse(SALE_START) : Date.parse(SALE_END);
    var left = Math.max(0, target - Date.now());
    var d = Math.floor(left / 864e5), h = Math.floor(left / 36e5) % 24,
        m = Math.floor(left / 6e4) % 60, s = Math.floor(left / 1e3) % 60;
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (STATE === 'ended') { el.style.display = 'none'; continue; }
      el.innerHTML = '<span class="bf-cd-lab">' + (STATE === 'before' ? 'Starts in' : 'Ends in') + '</span>' +
        '<span class="bf-cd-unit" aria-hidden="true"><b>' + d + '</b><i>d</i></span>' +
        '<span class="bf-cd-unit" aria-hidden="true"><b>' + pad(h) + '</b><i>h</i></span>' +
        '<span class="bf-cd-unit" aria-hidden="true"><b>' + pad(m) + '</b><i>m</i></span>' +
        '<span class="bf-cd-unit" aria-hidden="true"><b>' + pad(s) + '</b><i>s</i></span>' +
        '<span class="bf-sr">' + (STATE === 'before' ? 'Sale starts ' : 'Sale ends ') +
          new Date(target).toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' Central</span>';
    }
    if (STATE === 'ended') {
      var bt = document.querySelector('[data-copy-id="BAR-TEXT"]');
      if (bt && !bt.getAttribute('data-ended')) {
        bt.setAttribute('data-ended', '1');
        bt.textContent = 'The Black Friday sale has ended.';
      }
    }
  }

  // ---------- products ----------
  function variantOf(handle) {
    var p = byHandle[handle];
    return p && p.variants && p.variants.nodes[0];
  }
  function priceBlock(regular) {
    if (pctOn()) {
      var sale = Math.round(regular * (100 - SALE_PCT)) / 100;
      return '<div class="bf-price"><span class="bf-sr">Regular price</span><span class="bf-was">' + money(regular) +
             '</span><span class="bf-sr">Sale price</span><span class="bf-now">' + money(sale) + '</span></div>';
    }
    return '<div class="bf-price"><span class="bf-reg">' + money(regular) + '</span></div>';
  }
  function curHandle(P) { return P.handles[P.sel || 0]; }
  function addBtn(P, cls) {
    var h = curHandle(P), v = variantOf(h), ok = v && v.availableForSale !== false;
    return '<button type="button" class="' + cls + '" data-bf-add="' + esc(h) + '"' + (ok ? '' : ' disabled') + '>' +
           (ok ? 'Add to cart' : 'Sold out') + '</button>';
  }
  function productCard(P) {
    var handle = curHandle(P), p = byHandle[handle], v = variantOf(handle);
    if (!p || !v) { return ''; }
    var sel = P.sel || 0;
    var img = p.featuredImage ? '<img src="' + esc(p.featuredImage.url) + '" alt="' + esc(P.name) + '" loading="lazy">' : '';
    var fmt = P.fmts
      ? '<div class="bf-fmt" role="group" aria-label="Format">' + P.fmts.map(function (f, i) {
          return '<button type="button" data-bf-fmt="' + P.id + '" data-i="' + i + '" aria-pressed="' + (i === sel) + '">' + esc(f) + '</button>';
        }).join('') + '</div>' : '';
    return '<div class="bf-card" data-bf-prod="' + P.id + '">' +
      (P.badge ? '<span class="bf-badge">' + esc(P.badge) + '</span>' : '') +
      '<div class="bf-p-img">' + img + '</div>' +
      '<p class="bf-eyebrow">' + esc(P.eyebrow) + '</p>' +
      '<h3 class="bf-p-h">' + esc(P.name) + '</h3>' +
      '<p class="bf-card-p">' + esc(P.desc) + '</p>' + fmt +
      '<div class="bf-card-spacer"></div>' +
      priceBlock(Number(v.price.amount)) +
      '<div class="bf-btn-pair"><button type="button" class="bf-more" data-bf-pop="' + P.id + '">Learn more</button>' +
        addBtn(P, 'bf-add') + '</div></div>';
  }
  function renderGroup(group, boxId) {
    var box = $(boxId);
    if (!box) { dbg('no #' + boxId); return; }
    box.innerHTML = PRODUCTS.filter(function (P) { return P.group === group; }).map(productCard).join('') ||
      '<p class="bf-loading">Products are unavailable right now. Please check back soon.</p>';
  }
  function renderAll() { safe('best', function () { renderGroup('best', 'bf-best'); }); safe('more', function () { renderGroup('more', 'bf-more'); }); }

  // ---------- pop-ups ----------
  function mountPop() {
    if ($('bf-pop')) { return; }
    var d = document.createElement('div');
    d.innerHTML = '<div id="bf-pop-backdrop"></div><div id="bf-pop" role="dialog" aria-modal="true" aria-labelledby="bf-pop-h"><div id="bf-pop-body"></div></div>';
    while (d.firstChild) { document.body.appendChild(d.firstChild); }
  }
  var popFocus = null, popId = null;
  function openPop(id) {
    var P = PRODUCTS.filter(function (x) { return x.id === id; })[0];
    var body = $('bf-pop-body');
    if (!P || !body) { return; }
    popId = id;
    var v = variantOf(curHandle(P));
    body.innerHTML = '<div class="bf-pop-top"><div><p class="bf-eyebrow">' + esc(P.name) + '</p><h3 id="bf-pop-h">' + esc(P.pop.h) + '</h3></div>' +
      '<button type="button" id="bf-pop-close" aria-label="Close">&times;</button></div>' +
      '<p class="bf-pop-open">' + esc(P.pop.open) + '</p>' +
      P.pop.blocks.map(function (b) { return '<div class="bf-pop-blk"><b>' + esc(b[0]) + '</b><p>' + esc(b[1]) + '</p></div>'; }).join('') +
      '<div class="bf-pop-foot">' + (v ? priceBlock(Number(v.price.amount)) : '') + addBtn(P, 'bf-add bf-pop-add') + '</div>';
    popFocus = document.activeElement;
    $('bf-pop').classList.add('open'); $('bf-pop-backdrop').classList.add('open');
    document.documentElement.classList.add('bf-noscroll');
    var c = $('bf-pop-close'); if (c) { c.focus(); }
  }
  function closePop() {
    var p = $('bf-pop'); if (!p || !p.classList.contains('open')) { return; }
    p.classList.remove('open'); $('bf-pop-backdrop').classList.remove('open');
    document.documentElement.classList.remove('bf-noscroll');
    popId = null;
    if (popFocus && popFocus.focus) { popFocus.focus(); }
  }

  // ---------- load ----------
  function allHandles() {
    var seen = {}, out = [];
    PRODUCTS.forEach(function (P) { P.handles.forEach(function (h) { if (!seen[h]) { seen[h] = 1; out.push(h); } }); });
    return out;
  }
  function loadProducts() {
    var hs = allHandles();
    var decls = hs.map(function (h, i) { return '$h' + i + ':String!'; }).join(',');
    var fields = hs.map(function (h, i) {
      return 'p' + i + ':product(handle:$h' + i + '){handle title featuredImage{url} variants(first:1){nodes{id availableForSale price{amount currencyCode}}}}';
    }).join(' ');
    var vars = {};
    hs.forEach(function (h, i) { vars['h' + i] = h; });
    return gql('query(' + decls + '){' + fields + '}', vars).then(function (r) {
      var d = r.json && r.json.data;
      if (!d) { throw new Error('no data (HTTP ' + r.status + ')'); }
      var n = 0;
      hs.forEach(function (h, i) { if (d['p' + i]) { byHandle[h] = d['p' + i]; n++; } else { dbg('handle not visible: ' + h); } });
      dbg('loaded ' + n + ' of ' + hs.length + ' products');
      return n;
    });
  }

  // ---------- cart ----------
  var CART_FIELDS = 'id checkoutUrl totalQuantity discountCodes{code applicable} cost{subtotalAmount{amount currencyCode}} lines(first:50){nodes{id quantity merchandise{... on ProductVariant{id price{amount currencyCode} product{title featuredImage{url}}}}}}';

  function mountCart() {
    if ($('bf-cart-drawer')) { return; }
    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<button type="button" id="bf-cart-toggle" aria-controls="bf-cart-drawer" aria-label="Open cart">Cart <span id="bf-cart-count">0</span></button>' +
      '<div id="bf-cart-backdrop"></div>' +
      '<aside id="bf-cart-drawer" role="dialog" aria-modal="true" aria-label="Your cart">' +
        '<div class="bf-cart-head"><h2>Your cart</h2><button type="button" id="bf-cart-close" aria-label="Close cart">&times;</button></div>' +
        '<div id="bf-cart-lines"><p style="color:#7a8ab0;text-align:center;padding:20px 0">Your cart is empty.</p></div>' +
        '<div class="bf-cart-foot"><p id="bf-cart-code" class="bf-cart-code" style="display:none"></p>' +
          '<p class="bf-cart-sub"><span>Subtotal</span><span id="bf-cart-subtotal">$0.00</span></p>' +
          '<button type="button" id="bf-checkout" disabled>Checkout</button>' +
          '<p class="bf-cart-fine">Secure checkout on Synergized Supplements, Dr. Jaban’s store.</p></div>' +
      '</aside>';
    while (wrap.firstChild) { document.body.appendChild(wrap.firstChild); }
  }
  function cls(id, name, on) { var el = $(id); if (el) { el.classList[on ? 'add' : 'remove'](name); } }
  var lastFocus = null;
  function openCart() { lastFocus = document.activeElement; cls('bf-cart-drawer', 'open', true); cls('bf-cart-backdrop', 'open', true); var c = $('bf-cart-close'); if (c) { c.focus(); } }
  function closeCart() { cls('bf-cart-drawer', 'open', false); cls('bf-cart-backdrop', 'open', false); if (lastFocus && lastFocus.focus) { lastFocus.focus(); } }

  function cartAttrs() {
    return [{ key: '_af_source', value: 'drjabanmoore-webflow-black-friday' },
            { key: '_af_landing_page', value: location.pathname || '/' },
            { key: '_utm_campaign', value: 'black-friday-2026' }];
  }
  function checkoutHref(cart) {
    if (!cart || !cart.checkoutUrl) { return ''; }
    var u = cart.checkoutUrl + (cart.checkoutUrl.indexOf('?') === -1 ? '?' : '&') + UTM;
    if (codeOn()) { u += '&discount=' + encodeURIComponent(DISCOUNT); }
    return u;
  }
  function renderCart(cart) {
    var count = cart ? cart.totalQuantity : 0;
    var cnt = $('bf-cart-count'); if (cnt) { cnt.textContent = count; }
    var box = $('bf-cart-lines');
    if (box) {
      var lines = (cart && cart.lines.nodes) || [];
      box.innerHTML = lines.length ? lines.map(function (l) {
        var m = l.merchandise, img = m.product.featuredImage ? m.product.featuredImage.url : '';
        return '<div class="bf-line"><img src="' + esc(img) + '" alt=""><div class="bf-ln">' + esc(m.product.title.split(' (')[0]) +
          '<br><span class="bf-lp">' + money(m.price.amount) + '</span><div class="bf-qty">' +
          '<button type="button" class="qb" data-line="' + esc(l.id) + '" data-qty="' + (l.quantity - 1) + '" aria-label="Decrease quantity">&minus;</button>' +
          '<span>' + l.quantity + '</span>' +
          '<button type="button" class="qb" data-line="' + esc(l.id) + '" data-qty="' + (l.quantity + 1) + '" aria-label="Increase quantity">+</button>' +
          '<button type="button" class="rm" data-line="' + esc(l.id) + '">Remove</button></div></div></div>';
      }).join('') : '<p style="color:#7a8ab0;text-align:center;padding:20px 0">Your cart is empty.</p>';
    }
    var sub = $('bf-cart-subtotal'); if (sub) { sub.textContent = cart ? money(cart.cost.subtotalAmount.amount) : '$0.00'; }
    var code = $('bf-cart-code');
    if (code) {
      if (!codeOn()) { code.style.display = 'none'; }
      else {
        var live = ((cart && cart.discountCodes) || []).some(function (c) { return c.applicable && String(c.code).toUpperCase() === DISCOUNT.toUpperCase(); });
        code.style.display = '';
        code.className = 'bf-cart-code' + (live ? ' on' : '');
        code.innerHTML = live ? '&#10003; Code <b>' + esc(DISCOUNT) + '</b> is on your cart.'
          : (STATE === 'before' ? 'Code <b>' + esc(DISCOUNT) + '</b> starts working when the sale opens.'
                                : 'Enter code <b>' + esc(DISCOUNT) + '</b> at checkout.');
      }
    }
    var btn = $('bf-checkout');
    if (btn) {
      btn.disabled = !cart || count === 0;
      btn.onclick = function () { var u = checkoutHref(cart); if (u) { window.location.href = u; } };
    }
  }
  function cartFail(e) {
    dbg('cart error: ' + (e && e.message ? e.message : e));
    alert('Sorry, the cart could not be updated. Please try again.');
  }
  function setBusy(on) { cls('bf-cart-drawer', 'busy', on); }
  function addLines(lines, btn) {
    if (btn) { btn.classList.add('busy'); }
    function done() { if (btn) { btn.classList.remove('busy'); } }
    function opened(c) { done(); closePop(); renderCart(c); openCart(); }
    if (!cartId) {
      return gql('mutation($lines:[CartLineInput!]!,$codes:[String!],$attrs:[AttributeInput!]){cartCreate(input:{lines:$lines,discountCodes:$codes,attributes:$attrs}){cart{' + CART_FIELDS + '} userErrors{message}}}',
        { lines: lines, codes: codeOn() ? [DISCOUNT] : [], attrs: cartAttrs() })
        .then(function (r) {
          var c = r.json && r.json.data && r.json.data.cartCreate && r.json.data.cartCreate.cart;
          if (!c) { done(); return cartFail(r.raw); }
          cartId = c.id;
          try { localStorage.setItem(CART_KEY, cartId); } catch (e) {}
          opened(c);
        }).catch(function (e) { done(); cartFail(e); });
    }
    return gql('mutation($id:ID!,$lines:[CartLineInput!]!){cartLinesAdd(cartId:$id,lines:$lines){cart{' + CART_FIELDS + '} userErrors{message}}}',
      { id: cartId, lines: lines })
      .then(function (r) {
        var c = r.json && r.json.data && r.json.data.cartLinesAdd && r.json.data.cartLinesAdd.cart;
        if (!c) {
          done();
          cartId = null;
          try { localStorage.removeItem(CART_KEY); } catch (e) {}
          return addLines(lines, btn);
        }
        opened(c);
      }).catch(function (e) { done(); cartFail(e); });
  }
  function updateLine(lineId, qty) {
    setBusy(true);
    var q = qty < 1
      ? gql('mutation($id:ID!,$ids:[ID!]!){cartLinesRemove(cartId:$id,lineIds:$ids){cart{' + CART_FIELDS + '}}}', { id: cartId, ids: [lineId] })
      : gql('mutation($id:ID!,$lines:[CartLineUpdateInput!]!){cartLinesUpdate(cartId:$id,lines:$lines){cart{' + CART_FIELDS + '}}}', { id: cartId, lines: [{ id: lineId, quantity: qty }] });
    q.then(function (r) {
      setBusy(false);
      var d = r.json && r.json.data, c = d && (d.cartLinesRemove || d.cartLinesUpdate);
      if (c && c.cart) { renderCart(c.cart); }
    }).catch(function (e) { setBusy(false); cartFail(e); });
  }
  function restoreCart() {
    if (!cartId) { return; }
    gql('mutation($id:ID!,$codes:[String!]){cartDiscountCodesUpdate(cartId:$id,discountCodes:$codes){cart{' + CART_FIELDS + '}}}',
      { id: cartId, codes: codeOn() ? [DISCOUNT] : [] })
      .then(function (r) {
        var d = r.json && r.json.data && r.json.data.cartDiscountCodesUpdate;
        if (d && d.cart) { renderCart(d.cart); }
        else { cartId = null; try { localStorage.removeItem(CART_KEY); } catch (e) {} }
      }).catch(function () {});
  }

  // ---------- events ----------
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) { return; }
    if (t.closest('#bf-cart-toggle')) { openCart(); return; }
    if (t.closest('#bf-cart-close') || t.id === 'bf-cart-backdrop') { closeCart(); return; }
    if (t.closest('#bf-pop-close') || t.id === 'bf-pop-backdrop') { closePop(); return; }
    var pop = t.closest('[data-bf-pop]');
    if (pop) { ev.preventDefault(); openPop(pop.getAttribute('data-bf-pop')); return; }
    var qb = t.closest('.qb');
    if (qb) { ev.preventDefault(); updateLine(qb.getAttribute('data-line'), parseInt(qb.getAttribute('data-qty'), 10)); return; }
    var rm = t.closest('#bf-cart-drawer .rm');
    if (rm) { ev.preventDefault(); updateLine(rm.getAttribute('data-line'), 0); return; }
    var fb = t.closest('[data-bf-fmt]');
    if (fb) {
      var P = PRODUCTS.filter(function (x) { return x.id === fb.getAttribute('data-bf-fmt'); })[0];
      if (P) { P.sel = parseInt(fb.getAttribute('data-i'), 10) || 0; renderAll();
        var again = document.querySelector('[data-bf-fmt="' + P.id + '"][data-i="' + P.sel + '"]'); if (again) { again.focus(); } }
      return;
    }
    var pb = t.closest('[data-bf-add]');
    if (pb && !pb.disabled) {
      var v = variantOf(pb.getAttribute('data-bf-add'));
      dbg('add ' + pb.getAttribute('data-bf-add'));
      if (v) { addLines([{ merchandiseId: v.id, quantity: 1 }], pb); }
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { closePop(); closeCart(); } });

  // ---------- boot ----------
  function boot() {
    safe('countdown', paintCountdowns);
    setInterval(function () { safe('countdown', paintCountdowns); }, 1000);
    safe('cart mount', mountCart);
    safe('pop mount', mountPop);
    loadProducts().then(function () { renderAll(); }).catch(function (e) {
      dbg('product load failed: ' + (e && e.message ? e.message : e));
      ['bf-best', 'bf-more'].forEach(function (id) {
        var b = $(id); if (b) { b.innerHTML = '<p class="bf-loading">The shop is temporarily unavailable. Please refresh in a minute.</p>'; }
      });
    });
    restoreCart();
  }
  if (document.readyState !== 'loading') { boot(); } else { document.addEventListener('DOMContentLoaded', boot); }
})();
</script>
